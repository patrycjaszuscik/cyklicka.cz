      cs: { clinical: 'Účinnými látkami jsou ginsenosidy, saponiny, které chrání membrány nervových a imunitních buněk. Studie popisují aktivaci makrofágů, vyšší aktivitu NK buněk a mírné zlepšení paměti a pozornosti. Data k srdci a krevnímu tlaku jsou zatím předběžná.',
            biohack: 'Hledá se standardizace na ginsenosidy a cykluje se osm týdnů braní, dva týdny pauza. Asijský druh se bere na vyčerpání, americký na dlouhodobé napětí.',
            folk: 'V čínské medicíně se přes tři tisíce let používá na obnovu jing, tedy základní životní energie. Cherokeeové nazývali americký druh „malý muž" a brali ho jako obecné tonikum i jako bylinu, která posiluje účinek ostatních.' },
      en: { clinical: 'The active compounds are ginsenosides, saponins that protect the membranes of nerve and immune cells. Studies describe macrophage activation, higher NK cell activity and modest gains in memory and attention. Heart and blood pressure data is still preliminary.',
            biohack: 'Look for standardised ginsenosides and cycle eight weeks on, two weeks off. The Asian root is used for depletion, the American one for long-running tension.',
            folk: 'Chinese medicine has used it for over three thousand years to restore jing, the body’s basic vitality. The Cherokee called the American species "little man" and used it as a general tonic and as a herb that strengthens the others.' } },
    tulsi: {
      cs: { clinical: 'Menší randomizované studie popisují pokles úzkosti a vnímaného stresu po šesti až osmi týdnech. Nosnými látkami jsou eugenol a kyselina ursolová. Zkoumá se i mírný vliv na hladinu cukru v krvi.',
            biohack: 'Nejčastěji se pije jako čaj dvakrát denně, protože účinné silice se uvolňují do horké vody lépe než ze suché kapsle.',
            folk: 'V Indii roste u domů a považuje se za posvátnou rostlinu. Tradičně se používá na kašel, horečku a neklidnou mysl. Jméno tulsi znamená „nesrovnatelná".' },
      en: { clinical: 'Small randomised trials describe drops in anxiety and perceived stress after six to eight weeks. The key compounds are eugenol and ursolic acid. A mild effect on blood sugar is also being studied.',
            biohack: 'Most often drunk as tea twice a day, since the active oils release into hot water better than from a dry capsule.',
            folk: 'In India it grows beside houses and is treated as sacred. Traditionally used for cough, fever and a restless mind. The name tulsi means "the incomparable one".' } },
    licorice: {
      cs: { clinical: 'Popisuje se protizánětlivý, antivirový, antialergický a jaterně ochranný účinek. Glycyrrhizin zpomaluje odbourávání kortizolu, což vysvětluje jak podporu při vyčerpání, tak vzestup krevního tlaku. Ve směsích se používá jako zesilovač účinku ostatních bylin.',
            biohack: 'Ranní dávka se volí u lidí s nízkým ranním kortizolem. Forma DGL se cucá před jídlem kvůli žaludeční sliznici a tlak nezvyšuje.',
            folk: 'Theofrastos ji popsal už ve 3. století před naším letopočtem. Latinský název znamená doslova sladký kořen. V čínských recepturách ladí chuť i účinek ostatních bylin a tradičně se užívala na chrapot a vředy.' },
      en: { clinical: 'Anti-inflammatory, antiviral, antiallergic and liver-protective activity is described. Glycyrrhizin slows the breakdown of cortisol, which explains both the support in depletion and the rise in blood pressure. In formulas it is used to potentiate the other herbs.',
            biohack: 'A morning dose suits people with low morning cortisol. The DGL form is chewed before meals for the stomach lining and does not raise blood pressure.',
            folk: 'Theophrastus described it in the third century BCE. Its Latin name literally means sweet root. In Chinese formulas it harmonises both taste and effect, and it was traditionally used for hoarseness and ulcers.' } },
    schisandra: {
      cs: { clinical: 'Lignany, hlavně schisandrin, se zkoumají pro ochranu jater a mírné zlepšení pozornosti a výdrže. Data pocházejí převážně z Asie a z menších studií.',
            biohack: 'Kombinuje se s rhodiolou a eleutherem do trojice, která vzešla ze sovětského výzkumu výkonnosti. Bere se ráno s jídlem.',
            folk: 'V čínské medicíně se říká, že zasahuje všech pět orgánových systémů najednou — odtud pět chutí plodu. Tradičně se používala pro pleť a jako tonikum ledvin.' },
      en: { clinical: 'The lignans, mainly schisandrin, are studied for liver protection and modest gains in attention and stamina. Most data comes from Asia and from small trials.',
            biohack: 'Combined with rhodiola and eleuthero into the trio that came out of Soviet performance research. Taken in the morning with food.',
            folk: 'Chinese medicine holds that it reaches all five organ systems at once — hence the berry’s five flavours. Traditionally used for the skin and as a kidney tonic.' } },
    shilajit: {
      cs: { clinical: 'Menší studie sledují únavu, hladinu CoQ10 v mitochondriích a vstřebávání železa. U žen je dat výrazně méně než u mužů. Účinek se připisuje fulvové kyselině, která funguje jako přenašeč minerálů do buňky.',
            biohack: 'Rozpouští se v teplé, ne vroucí vodě. Bere se ráno, často spolu s CoQ10 nebo hořčíkem.',
            folk: 'V ájurvédě se mu říká přemožitel slabosti. Sbírá se v létě, kdy teplo vytlačí pryskyřici ze skalních spár.' },
      en: { clinical: 'Small studies look at fatigue, mitochondrial CoQ10 and iron uptake. There is far less data in women than in men. The effect is attributed to fulvic acid, which acts as a carrier of minerals into the cell.',
            biohack: 'Dissolve in warm, not boiling water. Taken in the morning, often alongside CoQ10 or magnesium.',
            folk: 'Ayurveda calls it the conqueror of weakness. It is gathered in summer, when heat pushes the resin out of the rock.' } },
    'he-shou-wu': {
      cs: { clinical: 'Zvířecí a menší lidské studie popisují antioxidační a neuroprotektivní účinek a vliv na dermální papily ve vlasovém folikulu. Zároveň jsou v literatuře popsané případy jaterní toxicity, častěji u vodného extraktu.',
            biohack: 'Používá se výhradně upravený kořen, tedy sušený a vařený — surový silně projímá. Bere se v cyklech, ne trvale, a s kontrolou jaterních testů.',
            folk: 'V čínské medicíně posiluje krev, šlachy, ledviny a játra. Taoističtí mniši ho řadili mezi tonika ducha. Jméno odkazuje na muže, kterému po užívání zčernaly vlasy.' },
      en: { clinical: 'Animal and smaller human studies describe antioxidant and neuroprotective effects and action on the dermal papilla in the hair follicle. Cases of liver toxicity are also on record, more often with the water extract.',
            biohack: 'Only the prepared root is used — dried and cooked, since the raw root is strongly laxative. Taken in cycles rather than continuously, with liver tests.',
            folk: 'Chinese medicine uses it to strengthen blood, tendons, kidneys and liver. Daoist monks counted it among the spirit tonics. Its name points to a man whose hair turned black again.' } },
    guduchi: {
      cs: { clinical: 'Studie na zvířatech i u lidí popisují ochranu jater před chemickým poškozením a podporu obnovy jaterních buněk. U revmatoidní artritidy se zkoumá právě proto, že imunitu podle potřeby tlumí i posiluje.',
            biohack: 'Bere se jako prášek nebo odvar ze stonku, obvykle v šestitýdenních cyklech. Kombinuje se s ashwagandhou při vyčerpání s častými infekcemi.',
            folk: 'V ájurvédě patří mezi rasájany a jméno amrita znamená nektar nesmrtelnosti. Tradičně se používala při horečkách a rekonvalescenci.' },
      en: { clinical: 'Animal and human studies describe protection of the liver against chemical damage and support for the regeneration of liver cells. It is studied in rheumatoid arthritis precisely because it both calms and strengthens immunity as needed.',
            biohack: 'Taken as stem powder or decoction, usually in six-week cycles. Combined with ashwagandha in depletion with frequent infections.',
            folk: 'In Ayurveda it is a rasayana, and the name amrita means nectar of immortality. Traditionally used in fevers and convalescence.' } },
    astragalus: {
      cs: { clinical: 'Zkoumá se hlavně pro imunitu a srdce — jedna studie u pacientů se srdečním selháním popsala výrazné zlepšení srdeční funkce po nitrožilním podání. Účinek se připisuje polysacharidům, které stimulují makrofágy a NK buňky.',
            biohack: 'Bere se dlouhodobě a preventivně, ne akutně při infekci. Kořen se dá vařit do vývaru jako běžná surovina.',
            folk: 'Huang qi znamená žlutý vůdce — podle barvy kořene a podle postavení mezi bylinami na posílení qi. V Číně se přidává do polévek celé rodině.' },
      en: { clinical: 'Studied mainly for immunity and the heart — one trial in heart failure patients reported a marked improvement in cardiac function after intravenous use. The effect is attributed to polysaccharides that stimulate macrophages and NK cells.',
            biohack: 'Taken long term and preventively rather than acutely during an infection. The root can be simmered into broth as an ordinary ingredient.',
            folk: 'Huang qi means yellow leader — for the colour of the root and its standing among the qi-strengthening herbs. In China it goes into soup for the whole family.' } },
    mucuna: {
      cs: { clinical: 'Obsahuje L-dopu, přímý předstupeň dopaminu, noradrenalinu a adrenalinu. Klinické studie u Parkinsonovy choroby ukázaly, že přírodní L-dopa se vstřebá rychleji než syntetická levodopa. Menší práce popisují nižší hladinu stresu a zlepšení nálady.',
            biohack: 'Hledá se extrakt standardizovaný na obsah L-dopy, obvykle 15 procent. Bere se nalačno a krátkodobě, ne denně po měsíce.',
            folk: 'Ve Střední Americe se boby praží a melou na nápoj podobný kávě. V Brazílii se semeno používalo na třes, v ájurvédě na neklid a nespavost.' },
      en: { clinical: 'It contains L-dopa, the direct precursor to dopamine, noradrenaline and adrenaline. Clinical trials in Parkinson’s found the natural L-dopa absorbed faster than synthetic levodopa. Smaller studies describe lower stress levels and better mood.',
            biohack: 'Look for an extract standardised to L-dopa, usually 15 percent. Taken fasted and short term, not daily for months.',
            folk: 'In Central America the beans are roasted and ground into a coffee-like drink. In Brazil the seed was used for tremor; in Ayurveda for restlessness and insomnia.' } },
    jiaogulan: {
      cs: { clinical: 'Zkoumá se pro krevní oběh, citlivost na inzulin a buněčnou energii. Popisuje se aktivace AMPK, tedy stejného přepínače, který tělo zapíná při pohybu a hladovění.',
            biohack: 'Pije se jako čaj dvakrát denně nebo se bere jako extrakt před tréninkem kvůli průtoku krve.',
            folk: 'V horách jižní Číny se jí říká bylina nesmrtelnosti — podle oblastí, kde se lidé dožívali vysokého věku a pili ji denně.' },
      en: { clinical: 'Studied for circulation, insulin sensitivity and cellular energy. Activation of AMPK is described — the same switch the body flips during exercise and fasting.',
            biohack: 'Drunk as a tea twice a day, or taken as an extract before training for blood flow.',
            folk: 'In the mountains of southern China it is called the herb of immortality, after regions where people lived long and drank it daily.' } },
    'vitamin-d3': {
      cs: { clinical: 'Při nízké hladině doplnění snižuje riziko zlomenin a infekcí dýchacích cest. U žen, které mají dost, už přínos mizí.',
            biohack: 'Cílí se na hladinu 25-OH-D mezi 75 a 125 nmol/l, tedy výš než laboratorní norma. Kombinuje se s K2 a hořčíkem, bez kterých se vitamin D špatně aktivuje. Rhonda Patrick patří k těm, kdo hladinu měří dvakrát ročně a dávku podle ní upravují.',
            folk: 'Dětem se dával rybí tuk a dospělým se říkalo „choďte na slunce". Obojí mířilo na totéž. V severských zemích se lžíce tresčího oleje podávala povinně ve školách ještě v polovině minulého století.' },
      en: { clinical: 'When levels are low, supplementing lowers fracture and respiratory infection risk. If you are already sufficient, the benefit fades.',
            biohack: 'The target is a 25-OH-D level between 75 and 125 nmol/l, higher than the lab reference. It is paired with K2 and magnesium, without which D activates poorly. Rhonda Patrick is among those who test twice a year and adjust the dose to the result.',
            folk: 'Children got cod liver oil and adults were told to go out in the sun. Both aimed at the same thing. In Nordic countries a spoon of cod liver oil was still handed out in schools in the mid twentieth century.' } },
    magnesium: {
      cs: { clinical: 'Nejlepší data má na svalové křeče, migrénu a usínání — hlavně u žen s nízkým příjmem ze stravy.',
            biohack: 'Glycinát na večer, threonát pro mozek, malát na únavu. Huberman ho řadí mezi látky na usínání, obvykle v kombinaci s theaninem a glycinem. Hořčíkové koupele jsou oblíbené, ale vstřebávání kůží prokázané není.',
            folk: 'Koupele v Epsomské soli se na ztuhlé svaly a neklid používají po generace. Minerální prameny s vysokým obsahem hořčíku byly odedávna cílem lázeňských pobytů. Hořká sůl se zároveň užívala vnitřně jako projímadlo.' },
      en: { clinical: 'Best data covers muscle cramps, migraine, and falling asleep — mainly in women with low dietary intake.',
            biohack: 'Glycinate at night, threonate for the brain, malate for fatigue. Huberman lists it among sleep-onset compounds, usually with theanine and glycine. Magnesium baths are popular, but absorption through skin is unproven.',
            folk: 'Epsom salt baths have been used for stiff muscles and restlessness for generations. Mineral springs rich in magnesium drew spa visitors for centuries. The same bitter salt was taken internally as a laxative.' } },
    iron: {
      cs: { clinical: 'Při prokázaném nedostatku výrazně zlepšuje únavu a výkon. Bez nedostatku nepřináší nic a zatěžuje tělo.',
            biohack: 'Sleduje se ferritin s cílem nad 50 µg/l, ne jen dolní hranice normy. Dávkování obden se vstřebává lépe než denní, protože mezitím klesne hepcidin. U sportovkyň se hlídá i takzvaná footstrike hemolýza při dlouhém běhu.',
            folk: 'Vařilo se v litinových hrncích a jedla se játra — tak se železo doplňovalo dřív.' },
      en: { clinical: 'With proven deficiency it clearly improves fatigue and performance. Without it, there is no benefit and some burden.',
            biohack: 'Ferritin is tracked with a target above 50 mcg/l rather than the bottom of the range. Every-other-day dosing absorbs better than daily, because hepcidin falls in between. In runners, footstrike haemolysis is watched as an extra drain.',
            folk: 'Cooking in cast iron and eating liver were how iron was topped up before supplements.' } },
    'omega-3': {
      cs: { clinical: 'Spolehlivě snižuje triglyceridy a podporuje srdce. U nálady funguje spíš jako doplněk léčby než náhrada.',
            biohack: 'Měří se omega-3 index s cílem 8 až 12 procent. Hlídá se poměr k omega-6 z rostlinných olejů, který je v běžné stravě kolem 15:1 místo 4:1. Rhonda Patrick patří k nejhlasitějším zastáncům vyšších dávek, ale její osobní protokol není doporučení pro všechny.',
            folk: 'Lžíce rybího tuku denně byla u babiček samozřejmost, i když nikdo neznal slovo EPA. V pobřežních kulturách se tučné ryby jedly několikrát týdně bez jakékoli teorie. Inuitská strava upoutala vědce právě nízkým výskytem srdečních nemocí.' },
      en: { clinical: 'Reliably lowers triglycerides and supports the heart. For mood it works alongside treatment, not instead of it.',
            biohack: 'The omega-3 index is measured with a target of 8 to 12 percent. The ratio to omega-6 from seed oils gets watched, since typical diets run near 15:1 instead of 4:1. Rhonda Patrick is among the loudest advocates for higher doses, though her personal protocol is not a general recommendation.',
            folk: 'A daily spoon of cod liver oil was standard long before anyone knew the word EPA. Coastal cultures ate oily fish several times a week without any theory behind it. The Inuit diet first drew researchers because of its low rate of heart disease.' } },
    b12: {
      cs: { clinical: 'Při nedostatku spolehlivě upraví únavu a brnění. Injekce jsou potřeba jen při poruše vstřebávání.',
            biohack: 'Preferuje se metylkobalamin před kyanokobalaminem. Sleduje se homocystein společně s folátem a B6 jako ukazatel metylace. U veganek se měří kyselina methylmalonová, která odhalí deficit dřív než samotná hladina B12.',
            folk: 'Tradiční kuchyně ho dodávala přes vnitřnosti, vejce a kvašené potraviny.' },
      en: { clinical: 'In deficiency it reliably fixes fatigue and tingling. Injections are only needed with absorption problems.',
            biohack: 'Methylcobalamin is preferred over cyanocobalamin. Homocysteine is tracked alongside folate and B6 as a methylation marker. In vegans, methylmalonic acid is measured, since it reveals deficiency earlier than B12 levels do.',
            folk: 'Traditional cooking supplied it through organ meats, eggs, and fermented foods.' } },
    protein: {
      cs: { clinical: 'Vyšší příjem chrání svalovou hmotu při hubnutí i ve vyšším věku — to je nejlépe doložený efekt.',
            biohack: 'Hlídá se leucin v porci, obvykle kolem 2,5 g na jídlo jako spouštěč svalové syntézy. Bílkoviny se rozkládají do tří až čtyř jídel denně místo jedné velké porce. Stacy Sims doporučuje ženám jíst bílkovinu do hodiny po tréninku, na rozdíl od staršího anabolického okna u mužů.',
            folk: 'Vývar z kostí a tvaroh byly odjakživa jídlem pro sílu a rekonvalescenci.' },
      en: { clinical: 'Higher intake protects muscle during weight loss and in later life — the best-documented effect.',
            biohack: 'Leucine per serving gets the attention, usually around 2.5 g per meal as the trigger for muscle synthesis. Protein is spread across three or four meals rather than one large portion. Stacy Sims advises women to eat protein within an hour of training, unlike the older anabolic-window advice aimed at men.',
            folk: 'Bone broth and curd cheese were always the foods for strength and recovery.' } },
    folate: {
      cs: { clinical: 'Jednoznačně snižuje riziko rozštěpu neurální trubice. Patří k nejsilnějším doporučením v těhotenství vůbec.',
            biohack: 'Řeší se varianta genu MTHFR a přechod na metylfolát místo kyseliny listové. Mluví se o „neproměněné kyselině listové" v krvi, jejíž význam ale zůstává nejasný. CDC i nadále uvádí, že varianta MTHFR není důvod se kyselině listové vyhýbat.',
            folk: 'Zelená listová zelenina se těhotným doporučovala dávno předtím, než se folát objevil.' },
      en: { clinical: 'Clearly reduces neural tube defects. One of the strongest recommendations in all of pregnancy care.',
            biohack: 'The MTHFR variant and switching to methylfolate instead of folic acid are the talking points. Unmetabolised folic acid in blood gets discussed, though its significance remains unclear. Public health guidance still states that an MTHFR variant is no reason to avoid folic acid.',
            folk: 'Leafy greens were recommended in pregnancy long before folate was discovered.' } },
    creatine: {
      cs: { clinical: 'Opakovaně potvrzený přínos pro sílu a objem tréninku, u žen stejně jako u mužů. Metaanalýza u žen po menopauze ukázala větší nárůst svalové hmoty ve spojení se silovým tréninkem. U kostní hustoty zatím jasný efekt prokázaný nebyl.',
            biohack: 'Nově se zkoumá vliv na náladu, nevyspání a energii mozku v přechodu. Stacy Sims doporučuje aktivním ženám 3 až 5 g denně a řadí ho mezi nejdůležitější doplňky po čtyřicítce. Rhonda Patrick ho má ve svém denním stacku v dávce 5 g.',
            folk: 'Maso a ryby byly vždycky „jídlo pro sílu". Kreatin je přesně to, co obsahují.' },
      en: { clinical: 'Repeatedly confirmed benefit for strength and training volume, in women as much as men. A meta-analysis in postmenopausal women showed greater lean mass gains when combined with resistance training. A clear effect on bone density has not been established.',
            biohack: 'Newer work looks at mood, sleep deprivation and brain energy in menopause. Stacy Sims recommends 3 to 5 g a day for active women and counts it among the most important supplements after 40. Rhonda Patrick takes 5 g daily as part of her own stack.',
            folk: 'Meat and fish were always strength food. Creatine is exactly what they carry.' } },
    calcium: {
      cs: { clinical: 'Samotný vápník zlomeninám brání jen málo. Funguje ve dvojici s vitaminem D a se zátěží kostí.',
            biohack: 'Preferuje se vápník z jídla a přidává se K2, aby mířil do kostí, ne do cév. Diskutuje se o riziku kalcifikace tepen při vysokých dávkách z doplňků. Doporučuje se spočítat příjem ze stravy a doplňovat jen rozdíl.',
            folk: 'Mák, mandle a mléčné výrobky byly tradiční „kostní" jídlo.' },
      en: { clinical: 'Calcium alone does little for fractures. It works paired with vitamin D and with loading the bone.',
            biohack: 'Food calcium is preferred, with K2 added so it lands in bone rather than arteries. The risk of arterial calcification from high supplemental doses gets debated. The advice is to calculate dietary intake and supplement only the shortfall.',
            folk: 'Poppy seed, almonds, and dairy were the traditional bone foods.' } },
    'vitamin-c': {
      cs: { clinical: 'Nachlazení nezastaví, ale může ho mírně zkrátit. Jasně prokázaná je pomoc se vstřebáváním železa.',
            biohack: 'Řeší se lipozomální formy a dělení dávky, protože vstřebávání má strop.',
            folk: 'Šípkový čaj a kysané zelí byly zimní zásobou vitaminu C.' },
      en: { clinical: 'It will not stop a cold but may shorten it slightly. The proven part is helping iron absorption.',
            biohack: 'Liposomal forms and split dosing get attention, since absorption has a ceiling.',
            folk: 'Rosehip tea and sauerkraut were the winter vitamin C store.' } },
    zinc: {
      cs: { clinical: 'Zkrácení nachlazení má data u pastilek užitých v prvních hodinách, ne u tablet po týdnu.',
            biohack: 'Sleduje se poměr zinku a mědi, obvykle kolem 15:1, aby dlouhodobé doplňování nevyčerpalo měď. Používá se „chuťový test" na odhad nedostatku, i když jeho spolehlivost je sporná. Večer s jídlem bývá snášený lépe než nalačno.',
            folk: 'Dýňová semínka a ústřice měly odjakživa pověst jídla pro plodnost.' },
      en: { clinical: 'Shortening a cold has data for lozenges in the first hours, not tablets a week in.',
            biohack: 'The zinc-to-copper ratio is tracked, usually near 15:1, so long-term supplementing does not deplete copper. A taste test is used to guess status, though its reliability is debatable. Evening with food is usually tolerated better than fasted.',
            folk: 'Pumpkin seeds and oysters always had a reputation as fertility foods.' } },
    b6: {
      cs: { clinical: 'Má data na zmírnění PMS i na ranní nevolnost v těhotenství, často v kombinaci s doxylaminem.',
            biohack: 'Doporučuje se aktivní forma P5P a hlídá se, aby dlouhodobá dávka nepřekročila 50 mg.',
            folk: 'Na nevolnost se tradičně sahalo po zázvoru. B6 míří na stejný cíl jinou cestou.' },
      en: { clinical: 'Has data for easing PMS and for morning sickness, often combined with doxylamine.',
            biohack: 'The active P5P form is preferred, with long-term doses kept under 50 mg.',
            folk: 'Ginger was the traditional answer to nausea. B6 aims at the same target another way.' } },
    iodine: {
      cs: { clinical: 'Doplnění v těhotenství chrání vývoj mozku dítěte. Nadbytek naopak může spustit poruchu štítné žlázy.',
            biohack: 'Testuje se jód z moči, hlavně u žen, které nepoužívají jodizovanou sůl.',
            folk: 'Mořské řasy a jodizovaná sůl patří k nejstarším veřejným zdravotním opatřením vůbec.' },
      en: { clinical: 'Supplementing in pregnancy protects fetal brain development. Excess can trigger thyroid trouble.',
            biohack: 'Urinary iodine is tested, especially by women avoiding iodised salt.',
            folk: 'Seaweed and iodised salt are among the oldest public health measures anywhere.' } },
    choline: {
      cs: { clinical: 'Vyšší příjem v těhotenství se v některých studiích pojí s lepší pamětí u dětí.',
            biohack: 'Sleduje se spolu s omega-3 jako stavebnice buněčných membrán a acetylcholinu.',
            folk: 'Vejce byla vždycky jídlo pro těhotné. Ne náhodou jsou nejbohatším zdrojem cholinu.' },
      en: { clinical: 'Higher intake in pregnancy links to better infant memory in some trials.',
            biohack: 'Tracked with omega-3 as the building set for cell membranes and acetylcholine.',
            folk: 'Eggs were always food for expectant mothers. They are also the richest choline source.' } },
    k2: {
      cs: { clinical: 'Data na hustotu kostí jsou slibná, ale studie jsou menší a většinou japonské.',
            biohack: 'Populární je forma MK-7 spolu s D3, kvůli „směrování" vápníku mimo cévy.',
            folk: 'Natto, kysané zelí a zrající sýry dodávaly K2 dávno předtím, než ho někdo pojmenoval.' },
      en: { clinical: 'Bone density data is promising, but trials are smaller and largely Japanese.',
            biohack: 'MK-7 with D3 is the popular pairing, for steering calcium away from arteries.',
            folk: 'Natto, sauerkraut, and aged cheese supplied K2 long before it had a name.' } },
    collagen: {
      cs: { clinical: 'Meta-analýzy ukazují mírné zlepšení hydratace a pružnosti pleti po 8–12 týdnech užívání.',
            biohack: 'Kombinuje se s vitaminem C a pro klouby se cílí na vyšší dávku 10–15 g.',
            folk: 'Vývar z kostí vařený přes noc byl tradiční lék na klouby i na pleť.' },
      en: { clinical: 'Meta-analyses show modest gains in skin hydration and elasticity after 8–12 weeks.',
            biohack: 'Paired with vitamin C, with a higher 10–15 g target for joints.',
            folk: 'Overnight bone broth was the traditional remedy for both joints and skin.' } },
    biotin: {
      cs: { clinical: 'Prokazatelně pomáhá jen při skutečném nedostatku, který je u zdravé ženy vzácný.',
            biohack: 'Bere se spíš jako součást B komplexu a hlídá se zkreslení laboratorních testů.',
            folk: 'Žloutky a ořechy patřily k tradiční péči o vlasy zevnitř.' },
      en: { clinical: 'Proven help only in true deficiency, which is rare in a healthy woman.',
            biohack: 'Treated as part of a B complex, with lab test interference watched.',
            folk: 'Egg yolks and nuts were the traditional inside-out hair care.' } },
    probiotics: {
      cs: { clinical: 'Nejlepší data má na průjem po antibiotikách a na některé opakované poševní infekce.',
            biohack: 'Sleduje se mikrobiomový test, kmeny na míru a vláknina jako krmivo pro bakterie.',
            folk: 'Kefír, kysané zelí a podmáslí byly domácí probiotika po staletí.' },
      en: { clinical: 'Best data is for antibiotic-associated diarrhoea and some recurrent vaginal infections.',
            biohack: 'Microbiome testing, targeted strains, and fibre as bacterial food get the focus.',
            folk: 'Kefir, sauerkraut, and buttermilk were the household probiotics for centuries.' } },
    coq10: {
      cs: { clinical: 'Data má u srdečního selhání a u svalových obtíží při statinech. U plodnosti jsou studie menší.',
            biohack: 'Preferuje se ubichinol a užívá se s tukem nebo omega-3 kvůli vstřebávání.',
            folk: 'Vnitřnosti a sardinky — tradiční „silná" jídla, která CoQ10 přirozeně obsahují.' },
      en: { clinical: 'Has data in heart failure and statin muscle complaints. Fertility trials are smaller.',
            biohack: 'Ubiquinol is preferred, taken with fat or omega-3 for absorption.',
            folk: 'Organ meats and sardines — traditional strong foods naturally rich in CoQ10.' } },
    selenium: {
      cs: { clinical: 'U autoimunitní tyreoiditidy snižuje protilátky, ale klinický dopad zůstává nejistý.',
            biohack: 'Často se dávkuje jen přes dva para ořechy denně a hladina se měří.',
            folk: 'Para ořechy a mořské ryby platily za jídlo „pro dobrou krev".' },
      en: { clinical: 'In autoimmune thyroiditis it lowers antibodies, though the clinical payoff stays uncertain.',
            biohack: 'Often dosed as two Brazil nuts a day, with levels measured.',
            folk: 'Brazil nuts and sea fish counted as food for good blood.' } },
    inositol: {
      cs: { clinical: 'U PCOS zlepšuje ovulaci a citlivost na inzulin v několika randomizovaných studiích.',
            biohack: 'Hodně se řeší poměr myo- a D-chiro-inositolu 40:1.',
            folk: 'Citrusy, luštěniny a pohanka ho obsahují. Tradiční strava ho dodávala sama.' },
      en: { clinical: 'In PCOS it improves ovulation and insulin sensitivity across several randomised trials.',
            biohack: 'The 40:1 myo- to D-chiro-inositol ratio is the main talking point.',
            folk: 'Citrus, legumes, and buckwheat carry it. Traditional diets supplied it quietly.' } },
    'l-theanine': {
      cs: { clinical: 'Zlepšuje pocit klidu a pozornost, nejzřetelněji v kombinaci s kofeinem.',
            biohack: 'Klasická dvojice je 100 mg theaninu na 50 mg kofeinu, aby káva nervovala míň.',
            folk: 'Zelený čaj byl v Asii nápojem pro soustředěnou mysl při meditaci.' },
      en: { clinical: 'Improves felt calm and attention, most clearly when combined with caffeine.',
            biohack: 'The classic stack is 100 mg theanine to 50 mg caffeine, to take the edge off coffee.',
            folk: 'Green tea was the drink for a focused mind during meditation in Asia.' } },
    melatonin: {
      cs: { clinical: 'Zkracuje dobu usínání a pomáhá při jet lagu. Na dlouhodobou nespavost to ale lék není.',
            biohack: 'Prosazují se mikrodávky 0,3 mg a ranní světlo místo stále vyšších tablet.',
            folk: 'Tma po setmění a večerní bylinkový čaj dělaly totéž bez tablety.' },
      en: { clinical: 'Shortens time to fall asleep and helps jet lag. It is not a cure for long-term insomnia.',
            biohack: 'Microdoses of 0.3 mg and morning light are favoured over ever-bigger tablets.',
            folk: 'Darkness after dusk and an evening herbal tea did the same without a pill.' } },
    electrolytes: {
      cs: { clinical: 'Při zátěži nad hodinu a v horku snižují riziko křečí i nebezpečně nízkého sodíku.',
            biohack: 'Sleduje se ztráta sodíku potem — kdo má na tričku bílé mapy, potřebuje ho víc.',
            folk: 'Slaný vývar po nemoci nebo dřině je nejstarší iontový nápoj, jaký známe.' },
      en: { clinical: 'Over an hour of effort and in heat they cut the risk of cramps and dangerously low sodium.',
            biohack: 'Sweat sodium loss is tracked — white marks on your shirt mean you need more.',
            folk: 'Salty broth after illness or hard work is the oldest sports drink we know.' } },
    ashwagandha: {
      cs: { clinical: 'Menší randomizované studie ukazují pokles vnímaného stresu a hladiny kortizolu.',
            biohack: 'Používají se standardizované extrakty (KSM-66, Sensoril) a cykluje se po 8–12 týdnech.',
            folk: 'V ájurvédě patří mezi rasájany — byliny pro sílu a dlouhověkost. Užívá se tisíce let.' },
      en: { clinical: 'Smaller randomised trials show drops in perceived stress and cortisol.',
            biohack: 'Standardised extracts (KSM-66, Sensoril) are used, cycled every 8–12 weeks.',
            folk: 'In Ayurveda it is a rasayana — a herb for strength and long life, used for millennia.' } },
    rhodiola: {
      cs: { clinical: 'Data má na únavu z vyčerpání a mentální výkon, studie jsou ale malé a krátké.',
            biohack: 'Hledají se extrakty se 3 % rosavinů a 1 % salidrosidu, užívané ráno nalačno.',
            folk: 'Na Sibiři a ve Skandinávii se dávala před dlouhou cestou nebo prací v zimě.' },
      en: { clinical: 'Data covers burnout fatigue and mental performance, though trials are small and short.',
            biohack: 'Extracts with 3% rosavins and 1% salidroside, taken fasted in the morning, are sought.',
            folk: 'In Siberia and Scandinavia it was given before a long journey or winter work.' } },
    maca: {
      cs: { clinical: 'Malé studie naznačují lepší libido a náladu, kvalita důkazů je ale zatím nízká.',
            biohack: 'Rozlišuje se žlutá, červená a černá maca; preferuje se želatinizovaná forma pro trávení.',
            folk: 'V Andách se pěstuje tisíce let jako jídlo pro plodnost a výdrž ve vysoké nadmořské výšce.' },
      en: { clinical: 'Small studies hint at better libido and mood, but evidence quality is still low.',
            biohack: 'Yellow, red, and black maca are distinguished; the gelatinised form is easier to digest.',
            folk: 'Grown in the Andes for millennia as food for fertility and endurance at altitude.' } },
    vitex: {
      cs: { clinical: 'Několik studií ukazuje zmírnění PMS a napětí v prsou oproti placebu.',
            biohack: 'Sleduje se vliv na prolaktin; doporučuje se ráno a vydržet aspoň tři cykly.',
            folk: 'Ve středověku se mu říkalo „mnišský pepř" — měl v klášterech tlumit touhu.' },
      en: { clinical: 'Several trials show PMS and breast tenderness easing versus placebo.',
            biohack: 'Its effect on prolactin is tracked; taken in the morning, given at least three cycles.',
            folk: 'Known as monk\'s pepper in the Middle Ages — said to quiet desire in monasteries.' } },
    'black-cohosh': {
      cs: { clinical: 'Patří k nejlépe prozkoumaným bylinám na návaly. Výsledky jsou smíšené, ale nadějné.',
            biohack: 'Používají se standardizované extrakty a při delším užívání se hlídají jaterní testy.',
            folk: 'Severoameričtí domorodci ji používali na ženské potíže a při porodu po staletí.' },
      en: { clinical: 'Among the best-studied herbs for hot flashes. Results are mixed but promising.',
            biohack: 'Standardised extracts are used, with liver tests watched on longer courses.',
            folk: 'Native American communities used it for women\'s complaints and childbirth for centuries.' } },
    sage: {
      cs: { clinical: 'Malé studie ukazují pokles návalů a nočního pocení po čtyřech až osmi týdnech.',
            biohack: 'Sahá se po standardizovaných extraktech místo silic, kvůli obsahu thujonu.',
            folk: '„Proč by měl umírat ten, kdo má na zahradě šalvěj?" ptalo se středověké pořekadlo.' },
      en: { clinical: 'Small studies show flashes and night sweats easing after four to eight weeks.',
            biohack: 'Standardised extracts are chosen over essential oils because of thujone.',
            folk: '"Why should a man die who has sage in his garden?" asked a medieval saying.' } },
    epo: {
      cs: { clinical: 'Na návaly horka výsledky nepřesvědčily. U citlivosti prsou jsou data o něco lepší.',
            biohack: 'Zajímavá je kyselina gama-linolenová (GLA) a její protizánětlivý potenciál.',
            folk: 'Domorodci v Severní Americe pupalku používali na kůži a otoky — odtud „king\'s cure-all".' },
      en: { clinical: 'For hot flashes the results disappoint. For breast tenderness the data is a little better.',
            biohack: 'Gamma-linolenic acid (GLA) and its anti-inflammatory potential draw the interest.',
            folk: 'Native peoples used it on skin and swelling — hence the name king\'s cure-all.' } },
    'red-clover': {
      cs: { clinical: 'Metaanalýzy ukazují mírné snížení návalů, efekt je ale blízko placebu.',
            biohack: 'Sleduje se, jestli vaše střevní bakterie umí izoflavony přeměnit na equol — ne každá to umí.',
            folk: 'Červený jetel se vařil jako čaj „na čištění krve" a na kožní potíže.' },
      en: { clinical: 'Meta-analyses show a mild drop in flashes, though the effect sits close to placebo.',
            biohack: 'Whether your gut bacteria convert isoflavones into equol is the interesting part — not everyone\'s do.',
            folk: 'Red clover tea was brewed to cleanse the blood and calm skin complaints.' } },
    reishi: {
      cs: { clinical: 'Menší studie ukazují zlepšení kvality spánku a nižší únavu. Výsledky ale nejsou jednotné a vzorky bývají pod sto lidí. Na imunitu existují laboratorní data, klinických je málo.',
            biohack: 'Pije se večer jako „houbové kakao". Sleduje se obsah triterpenů, protože právě ty nesou zklidnění. Bez alkoholové extrakce v přípravku nejsou, takže vodní extrakt na spánek nestačí.',
            folk: 'V Číně ling-č, v Japonsku reiši. Byla vyhrazená císařům a v taoismu patřila mezi byliny nesmrtelnosti. Řadí se mezi ty, které „uklidňují šen", tedy ducha a mysl.' },
      en: { clinical: 'Smaller trials show better sleep quality and less fatigue. Results are inconsistent and samples usually under a hundred people. Immune effects have lab data but little clinical evidence.',
            biohack: 'Drunk in the evening as mushroom cacao. Triterpene content gets tracked, since that is what carries the calm. Without alcohol extraction they are absent, so a water extract will not do for sleep.',
            folk: 'Ling zhi in China, reishi in Japan. It was reserved for emperors and counted among the Taoist herbs of immortality. It belongs to the group that calms the shen, the spirit and mind.' } },
    'lions-mane': {
      cs: { clinical: 'Japonská studie u starších dospělých ukázala zlepšení kognitivních testů po 16 týdnech. Po vysazení efekt během měsíce vymizel. Ostatní studie jsou malé a krátké.',
            biohack: 'Bere se ráno, často s kávou nebo omega-3. Diskutuje se rozdíl mezi hericenony z plodnice a erinaciny z mycelia. Erinaciny lépe procházejí do mozku, což je vzácný případ, kdy má mycelium výhodu.',
            folk: 'V Číně se podávala mnichům před meditací pro soustředění. Její jméno chou-tchou-ku znamená „opičí hlava" podle vzhledu. Tradičně se vařila v polévkách, ne jako extrakt.' },
      en: { clinical: 'A Japanese trial in older adults showed better cognitive scores after 16 weeks. The effect faded within a month of stopping. Other studies are small and short.',
            biohack: 'Taken in the morning, often with coffee or omega-3. The debate is hericenones from the fruiting body versus erinacines from mycelium. Erinacines cross into the brain better, a rare case where mycelium wins.',
            folk: 'In China it was given to monks before meditation for focus. Its name hou tou gu means monkey head, after its appearance. Traditionally it went into soups rather than extracts.' } },
    cordyceps: {
      cs: { clinical: 'Studie na vytrvalostním výkonu ukazují mírné zvýšení VO2 max po třech až šesti týdnech. Efekt je výraznější u netrénovaných než u sportovkyň. U starších dospělých se zkoumá i vliv na únavu.',
            biohack: 'Populární před ranním tréninkem místo druhé kávy. Rozlišuje se militaris, pěstovaný a bohatší na kordycepin, a CS-4, kmen odvozený ze sinensis. Večer se neužívá, protože ruší spánek.',
            folk: 'Tibetští pastevci si jí všimli, když jejich jakové po pastvě v místech s cordycepsem překypovali energií. V čínské medicíně tonizuje ledviny a plíce, tedy dech a výdrž. Divoká houba patří k nejdražším surovinám světa.' },
      en: { clinical: 'Endurance trials show modest VO2 max gains after three to six weeks. The effect is clearer in untrained people than in athletes. Fatigue in older adults is also being studied.',
            biohack: 'Popular before a morning workout in place of a second coffee. Militaris, cultivated and richer in cordycepin, is distinguished from CS-4, a strain derived from sinensis. Not taken in the evening, as it disturbs sleep.',
            folk: 'Tibetan herders noticed it when their yaks grazed where it grew and became visibly livelier. In Chinese medicine it tonifies kidney and lung, meaning breath and stamina. The wild mushroom is among the priciest raw materials on earth.' } },
    tremella: {
      cs: { clinical: 'Klinických studií u lidí je velmi málo. Laboratorní data potvrzují mimořádnou schopnost vázat vodu a antioxidační působení. Bezpečnost je dobrá, protože jde o běžnou potravinu.',
            biohack: 'Objevuje se v kosmetice jako rostlinná alternativa kyseliny hyaluronové. Její molekuly jsou menší, takže pronikají do svrchních vrstev pokožky lépe. Kombinuje se s kolagenem a vitaminem C.',
            folk: 'Čínská císařovna Jang Kuej-fej ji prý jedla denně pro pleť. V TCM se řadí mezi byliny vyživující jin, tedy doplňující vláhu. Tradičně se vaří jako sladká polévka s jujubou a kustovnicí.' },
      en: { clinical: 'Human clinical trials are very scarce. Lab data confirms exceptional water-binding capacity and antioxidant action. Safety is good, since it is an ordinary food.',
            biohack: 'It appears in cosmetics as a plant alternative to hyaluronic acid. Its molecules are smaller, so they reach the upper skin layers more easily. Often combined with collagen and vitamin C.',
            folk: 'The Chinese empress Yang Guifei reportedly ate it daily for her complexion. In TCM it nourishes yin, replenishing moisture. Traditionally simmered into a sweet soup with jujube and goji.' } },
    chaga: {
      cs: { clinical: 'U lidí zatím prakticky bez kontrolovaných studií. Laboratorní data ukazují velmi vysokou antioxidační kapacitu a protizánětlivé působení.',
            biohack: 'Pije se jako náhrada ranní kávy, často s kakaem a skořicí. Sleduje se obsah betulinové kyseliny, kterou houba přebírá z březové kůry.',
            folk: 'Na Sibiři a v Karélii se vařila jako čaj po staletí; za války sloužila i jako náhražka kávy.' },
      en: { clinical: 'Almost no controlled human trials exist. Lab data shows very high antioxidant capacity and anti-inflammatory action.',
            biohack: 'Drunk as a morning coffee substitute, often with cacao and cinnamon. Betulinic acid, drawn from the birch bark, is what gets tracked.',
            folk: 'Simmered as tea across Siberia and Karelia for centuries, and used as a coffee substitute in wartime.' } },
    'turkey-tail': {
      cs: { clinical: 'Frakce PSK je v Japonsku od 80. let schválená jako doplňková léčba a patří k nejlépe zdokumentovaným houbovým extraktům vůbec.',
            biohack: 'Sleduje se hlavně jako prebiotikum — v menších studiích mění složení střevního mikrobiomu.',
            folk: 'V Číně se jun-č pila na posílení čchi při dlouhé rekonvalescenci. Roste běžně i v českých lesích.' },
      en: { clinical: 'Its PSK fraction has been approved in Japan since the 1980s as an adjuvant therapy, making it among the best-documented mushroom extracts.',
            biohack: 'Followed mainly as a prebiotic — smaller studies show it shifts gut microbiome composition.',
            folk: 'In China, yun zhi was decocted to strengthen qi during long convalescence. It grows commonly in European woods too.' } },
    shiitake: {
      cs: { clinical: 'Lentinan se v Japonsku podává injekčně jako podpůrná léčba. U houby jako potraviny jsou data slabší, ale konzistentní u cholesterolu.',
            biohack: 'Sušení na slunci lamelami vzhůru zvyšuje obsah vitaminu D2 — pár hodin stačí.',
            folk: 'V Číně doložená přes tisíc let. Za dynastie Ming se předepisovala na dlouhověkost a dýchání.' },
      en: { clinical: 'Lentinan is given injectably in Japan as supportive therapy. Food-level data is weaker but consistent for cholesterol.',
            biohack: 'Sun-drying gills-up raises vitamin D2 content — a few hours is enough.',
            folk: 'Documented in China for over a thousand years, prescribed in the Ming dynasty for longevity and breathing.' } },
    maitake: {
      cs: { clinical: 'D-frakce má malé studie na imunitní markery. U PCOS jedna japonská studie ukázala podporu ovulace srovnatelnou s klomifenem.',
            biohack: 'Sleduje se pro glykémii a citlivost na inzulin, často spolu s berberinem nebo inositolem.',
            folk: 'V Japonsku se sbírala jako poklad — jméno znamená tančící houba, prý podle radosti nálezců.' },
      en: { clinical: 'The D-fraction has small trials on immune markers. In PCOS, one Japanese study showed ovulation support comparable to clomiphene.',
            biohack: 'Followed for blood sugar and insulin sensitivity, often stacked with berberine or inositol.',
            folk: 'Hunted as treasure in Japan — the name means dancing mushroom, for the joy of finding one.' } },
    poria: {
      cs: { clinical: 'Samostatných klinických studií je minimum. Většina dat pochází ze směsí, kde je poria jednou z mnoha složek.',
            biohack: 'Zajímavá hlavně pro spánek a jako jemná podpora ledvin; v západních stacích se objevuje zřídka.',
            folk: 'Fu-ling patří k nejčastěji předepisovaným bylinám čínské medicíny — je ve stovkách klasických receptur na neklid, otoky a slabé trávení.' },
      en: { clinical: 'Standalone clinical trials barely exist. Most data comes from formulas where poria is one ingredient among many.',
            biohack: 'Of interest mainly for sleep and gentle kidney support; rarely seen in Western stacks.',
            folk: 'Fu ling is among the most-prescribed herbs in Chinese medicine, appearing in hundreds of classical formulas for restlessness, swelling and weak digestion.' } },
    nad: {
      cs: { clinical: 'U lidí zatím jen malé studie. NAD+ v krvi spolehlivě stoupá, ale přínos pro zdraví či energii se zatím jednoznačně neprokázal.',
            biohack: 'Jedna z nejsledovanějších látek longevity scény — David Sinclair ji proslavil, Asprey ji řadí do ranního stacku. Bere se ráno, často s resveratrolem nebo TMG.',
            folk: 'Žádná tradice. NAD+ byl objeven roku 1906 při výzkumu kvašení, doplňky přišly až po roce 2015.' },
      en: { clinical: 'Only small human studies so far. Blood NAD+ rises reliably, but a clear health or energy benefit has not been shown.',
            biohack: 'One of the most-watched longevity compounds — popularised by David Sinclair, part of Asprey\'s morning stack. Taken early, often with resveratrol or TMG.',
            folk: 'No tradition at all. NAD+ was discovered in 1906 in fermentation research; supplements arrived after 2015.' } },
    pqq: {
      cs: { clinical: 'Malé japonské studie ukazují zlepšení únavy, spánku a nálady po 8 týdnech při 20 mg denně.',
            biohack: 'Bere se jako „mitochondriální dvojka" s koenzymem Q10 — PQQ tvoří nové mitochondrie, Q10 pohání ty stávající.',
            folk: 'Přirozeně je v nattu, petrželce, kiwi a zeleném čaji. Objeven byl až v 70. letech.' },
      en: { clinical: 'Small Japanese trials show improvements in fatigue, sleep and mood after eight weeks at 20 mg.',
            biohack: 'Taken as the mitochondrial pair with CoQ10 — PQQ builds new mitochondria, Q10 powers the existing ones.',
            folk: 'Found naturally in natto, parsley, kiwi and green tea. Only discovered in the 1970s.' } },
    ala: {
      cs: { clinical: 'Nejsilnější data má u diabetické neuropatie. U PCOS zlepšuje citlivost na inzulin, často v kombinaci s myo-inositolem.',
            biohack: 'Preferuje se R-forma (přirozená) místo racemické směsi a kombinuje se s L-karnitinem pro mitochondrie.',

    const r = ROUTE[lang], alt = ROUTE[lang === 'cs' ? 'en' : 'cs'];
    const is = (seg, key) => seg === r[key] || seg === alt[key];
    let next = null, item = null;

          { n: 'Plátky kořene', f: 'Každodenní vývar', d: 'Nejlevnější. Vaří se hodinu s masem nebo zeleninou a pak se vyndají.' },
          { n: 'Extrakt na polysacharidy', f: 'Imunita', d: 'Standardizovaný, měřitelná dávka. Hledejte obsah polysacharidů v procentech.' },

        ],
        mix: 'Bere se dlouhodobě a preventivně, ne až při nachlazení. Při hormonálně citlivém nádoru a během chemoterapie o něm rozhoduje lékař, protože má estrogenní aktivitu a může do léčby zasáhnout.' },
      en: {
        intro: 'In China astragalus is both food and herb, so the forms run from slices in soup to a standardised extract.',
        list: [
          { n: 'Root slices', f: 'Everyday broth', d: 'Cheapest. Simmer for an hour with meat or vegetables, then remove.' },
          { n: 'Polysaccharide extract', f: 'Immunity', d: 'Standardised and measurable. Look for the polysaccharide percentage.' },
          { n: 'Liquid extract', f: 'No cooking', d: 'Drops in water. Faster, but pricier than slices.' }
        ],
        mix: 'It is taken long term and preventively, not once a cold starts. With a hormone-sensitive cancer or during chemotherapy the decision belongs to a doctor, since it has estrogenic activity and may interfere.' } },
    mucuna: {
      cs: {
        intro: 'Mucuna se od ostatních adaptogenů liší tím, že obsahuje látku s přímým lékovým účinkem — L-dopu. Proto na formě a obsahu záleží víc než u byliny.',
        list: [
          { n: 'Extrakt 15 % L-dopy', f: 'Nálada a motivace', d: 'Nejlépe měřitelný. Nalačno, ráno, krátkodobě.' },
          { n: 'Celý mletý bob', f: 'Tradiční užití', d: 'Slabší a proměnlivý obsah. Ve Střední Americe se praží jako náhražka kávy.' },
          { n: 'Vyšší standardizace (40–98 %)', f: 'Klinické dávky', d: 'Patří do rukou lékaře, ne do samoléčby.' }
        ],
        mix: 'Bílkovina v jídle soutěží s L-dopou o stejný přenašeč, proto se bere nalačno. Nikdy ji nekombinujte s antidepresivy typu SSRI nebo IMAO ani s léky na Parkinsonovu chorobu — dopaminové účinky se sčítají.' },
      en: {
        intro: 'Mucuna differs from the other adaptogens in containing a compound with a direct drug effect — L-dopa. So the form and content matter more than with a herb.',
        list: [
          { n: '15% L-dopa extract', f: 'Mood and motivation', d: 'The most measurable. Fasted, in the morning, short term.' },
          { n: 'Whole ground bean', f: 'Traditional use', d: 'Weaker and variable. In Central America it is roasted as a coffee substitute.' },
          { n: 'Higher standardisation (40–98%)', f: 'Clinical doses', d: 'Belongs with a doctor, not with self-treatment.' }
        ],
        mix: 'Dietary protein competes with L-dopa for the same transporter, which is why it is taken fasted. Never combine it with SSRI or MAOI antidepressants or with Parkinson’s medication — the dopamine effects add up.' } },
    jiaogulan: {
      cs: {
        intro: 'V jižní Číně se pije jako obyčejný čaj, takže i tady je nejtradičnější forma zároveň ta nejjemnější.',
        list: [
          { n: 'Sypaný čaj', f: 'Každodenní pití', d: 'Nasládlá chuť, snese několik zálivek. Dva šálky denně.' },
          { n: 'Extrakt na gypenosidy', f: 'Metabolismus a výkon', d: 'Měřitelná dávka. Před tréninkem kvůli průtoku krve.' },

        mix: 'S kozincem se v Číně kombinuje běžně. Protože zvyšuje průtok krve, poraďte se při lécích na ředění krve, a při potlačené imunitě po transplantaci ho neberte vůbec.' },
      en: {
        intro: 'In southern China it is drunk as an ordinary tea, so here too the most traditional form is also the gentlest.',
        list: [

        mix: 'It is routinely combined with astragalus in China. Because it increases blood flow, check first if you take blood thinners, and avoid it entirely on immune-suppressing treatment after a transplant.' } },
    magnesium: {
      cs: {
        intro: 'Na obalu je vždy sůl hořčíku — rozhoduje, kolik elementárního hořčíku obsahuje a jak dobře se vstřebá. Proto se stejné „400 mg" může chovat úplně jinak.',
        list: [
          { n: 'Glycinát (bisglycinát)', f: 'Klid, spánek, PMS', d: 'Nejšetrnější k žaludku, neprojímá. Večer 30–60 minut před spaním.' },
          { n: 'Citrát', f: 'Křeče a zácpa', d: 'Dobře vstřebatelný, ale ve vyšších dávkách uvolňuje stolici. Právě proto se hodí při zácpě.' },
          { n: 'Malát', f: 'Únava a bolavé svaly', d: 'Kyselina jablečná se podílí na tvorbě energie. Spíš ráno než večer.' },
          { n: 'Threonát', f: 'Mozek, paměť, spánek', d: 'Jediná forma se studiemi na průnik do mozku. Výrazně dražší, dat je zatím málo.' },
          { n: 'Taurát', f: 'Srdce a krevní tlak', d: 'Hořčík navázaný na taurin. Používá se u palpitací a vysokého tlaku.' },
          { n: 'Oxid', f: 'Nejlevnější varianta', d: 'Vstřebá se jen pár procent. Funguje hlavně jako projímadlo — na doplnění zásob je slabý.' },
          { n: 'Sulfát (Epsomská sůl)', f: 'Koupele', d: 'Příjemné na ztuhlé svaly, ale vstřebávání kůží není prokázané. Berte to jako relaxaci, ne jako dávku.' }
        ],
        mix: 'Nejdřív jedno upřesnění, protože se to často plete: samotný hořčík je ve všech formách stejný ion. Co se liší, je nosič, na který je navázaný — glycin uklidňuje, taurin působí na srdce, threonát projde do mozku, citrát táhne vodu do střeva. Ve střevě se ale formy sečtou do jedné celkové dávky — tři najednou tedy nepřinesou tři různé účinky, jen vyšší dávku hořčíku, kterou střevo odbaví průjmem. Vyberte formu podle toho, co řešíte, a počítejte vždy elementární hořčík, ne hmotnost tablety. Evropský strop pro hořčík z doplňků je 350 mg denně — hořčík z jídla se do něj nepočítá. Dávky nad 200 mg rozdělte do dvou porcí. A hořčík, vápník, zinek a železo soutěží o stejné přenašeče ve střevě, takže je neberte v jednu chvíli — rozestup aspoň dvě hodiny.'
      },
      en: {
        intro: 'The label always names a magnesium salt — what matters is how much elemental magnesium it carries and how well it absorbs. The same "400 mg" can behave very differently.',
        list: [
          { n: 'Glycinate (bisglycinate)', f: 'Calm, sleep, PMS', d: 'Gentlest on the stomach, no laxative effect. Take 30–60 minutes before bed.' },
          { n: 'Citrate', f: 'Cramps and constipation', d: 'Absorbs well but loosens stools at higher doses — which is exactly why it suits constipation.' },
          { n: 'Malate', f: 'Fatigue and sore muscles', d: 'Malic acid takes part in energy production. Better in the morning than at night.' },
          { n: 'Threonate', f: 'Brain, memory, sleep', d: 'The only form studied for crossing into the brain. Much pricier, and the data is still thin.' },
          { n: 'Taurate', f: 'Heart and blood pressure', d: 'Magnesium bound to taurine, used for palpitations and high blood pressure.' },
          { n: 'Oxide', f: 'The cheapest option', d: 'Only a few percent absorbs. It works mainly as a laxative — weak for topping up stores.' },
          { n: 'Sulfate (Epsom salt)', f: 'Baths', d: 'Lovely on stiff muscles, but absorption through skin is unproven. Treat it as relaxation, not a dose.' }
        ],
        mix: 'One correction first, because this gets muddled: the magnesium itself is the same ion in every form. What differs is the carrier it is bound to — glycine calms, taurine acts on the heart, threonate crosses into the brain, citrate pulls water into the gut. So taking three forms at once "to be safe" makes little sense: the magnesium simply adds up and you get diarrhoea instead of a better effect. Pick the form that matches what you are solving, and always count elemental magnesium, not tablet weight. The EU ceiling for supplemental magnesium is 350 mg a day; magnesium from food does not count towards it. Split anything above 200 mg. And magnesium, calcium, zinc and iron compete for the same gut transporters, so keep them at least two hours apart.'
      }
    },
    reishi: {
      cs: { intro: 'U hub rozhoduje víc než dávka to, co je vlastně v sáčku. Účinné látky jsou uzavřené v chitinové buněčné stěně, kterou lidské trávení nerozloží — bez extrakce projde houba tělem téměř beze změny.',
        list: [
          { n: 'Dvojitá extrakce', f: 'Zlatý standard', d: 'Horká voda vytáhne beta-glukany, alkohol triterpeny. Reishi potřebuje obojí — uklidňující účinek nesou právě triterpeny.' },
          { n: 'Beta-glukany, ne „polysacharidy"', f: 'Čtěte etiketu', d: 'Hledejte obsah beta-glukanů (ideálně nad 25 %). Údaj „polysacharidy 40 %" často znamená hlavně škrob z pěstebního substrátu.' },
          { n: 'Plodnice vs. mycelium', f: 'Plodnice je lepší', d: 'Mycelium pěstované na rýži nebo ovsu obsahuje jen zlomek účinných látek a hodně obilného škrobu.' },
          { n: 'Poměr extrakce', f: '8:1 a výš', d: 'Osm kilo houby na jedno kilo extraktu. Nižší poměr znamená slabší přípravek.' }
        ],
        mix: 'Reishi mírně ředí krev — nekombinujte s warfarinem ani vysokými dávkami omega-3 bez lékaře. Houby se nemíchají s imunosupresivy, protože imunitu naopak aktivují. Večer se snáší nejlépe; cordyceps naopak ráno, jinak ruší spánek. Vitamin C zvyšuje vstřebání beta-glukanů, proto se houby často pijí s citronem.'
      },
      en: { intro: 'With mushrooms, what is in the bag matters more than the dose. The active compounds sit inside a chitin cell wall that human digestion cannot break — without extraction the mushroom passes through almost unchanged.',
        list: [
          { n: 'Dual extraction', f: 'The gold standard', d: 'Hot water pulls out beta-glucans, alcohol pulls out triterpenes. Reishi needs both — the calming effect comes from the triterpenes.' },
          { n: 'Beta-glucans, not "polysaccharides"', f: 'Read the label', d: 'Look for beta-glucan content, ideally above 25%. "40% polysaccharides" often means starch from the growing substrate.' },
          { n: 'Fruiting body vs mycelium', f: 'Fruiting body wins', d: 'Mycelium grown on rice or oats carries a fraction of the actives and a lot of grain starch.' },
          { n: 'Extract ratio', f: '8:1 or higher', d: 'Eight kilos of mushroom per kilo of extract. A lower ratio means a weaker product.' }
        ],
        mix: 'Reishi thins blood slightly — not with warfarin or high-dose omega-3 without a doctor. Mushrooms do not mix with immunosuppressants, since they activate immunity. Reishi sits best in the evening; cordyceps in the morning or it disturbs sleep. Vitamin C improves beta-glucan absorption, which is why mushrooms are often taken with lemon.'
      }
    },
    iron: {
      cs: { intro: 'Formy se liší hlavně tím, jak dráždí žaludek a kolik elementárního železa obsahují.',
        list: [
          { n: 'Bisglycinát', f: 'Citlivé trávení', d: 'Nejšetrnější, méně zácpy. Dražší, ale lépe se snáší dlouhodobě.' },
          { n: 'Síran železnatý', f: 'Léčba nedostatku', d: 'Levný a účinný, ale často dráždí žaludek a způsobuje zácpu.' },
          { n: 'Dávkování obden', f: 'Lepší vstřebání', d: 'Užívání každý druhý den zvyšuje vstřebání — tělo mezitím sníží hladinu hepcidinu.' }
        ],
        mix: 'Nikdy současně s vápníkem, hořčíkem, zinkem, kávou ani čajem. Naopak vitamin C vstřebávání zlepšuje. Ideálně nalačno, a pokud to žaludek nesnese, s malým jídlem bez mléčných výrobků.' },
      en: { intro: 'Forms differ mainly in stomach tolerance and how much elemental iron they carry.',
        list: [
          { n: 'Bisglycinate', f: 'Sensitive stomachs', d: 'Gentlest, less constipation. Pricier but easier long term.' },
          { n: 'Ferrous sulfate', f: 'Treating deficiency', d: 'Cheap and effective, but often irritates the stomach.' },
          { n: 'Every other day', f: 'Better absorption', d: 'Alternate-day dosing absorbs better — hepcidin drops in between.' }
        ],
        mix: 'Never alongside calcium, magnesium, zinc, coffee or tea. Vitamin C helps. Best on an empty stomach, or with a small non-dairy meal.' }
    },
    calcium: {
      cs: { intro: 'Dvě hlavní formy se liší tím, kdy je brát.',
        list: [
          { n: 'Citrát', f: 'Nalačno i s jídlem', d: 'Vstřebá se i při nízké žaludeční kyselosti — vhodný po padesátce a při lécích na pálení žáhy.' },
          { n: 'Uhličitan', f: 'S jídlem', d: 'Levnější a koncentrovanější, ale potřebuje žaludeční kyselinu.' }
        ],
        mix: 'Střevo zvládne najednou vstřebat jen asi 500 mg, takže vyšší denní dávku rozdělte do dvou porcí. Vápník soutěží o stejné přenašeče se železem, zinkem i hořčíkem — mezi nimi nechte aspoň dvě hodiny. Naopak s vitaminem D a K2 patří dohromady: D vstřebávání řídí a K2 pomáhá vápník uložit do kosti místo do cévní stěny.' },
      en: { intro: 'The two main forms differ in when to take them.',
        list: [
          { n: 'Citrate', f: 'With or without food', d: 'Absorbs even with low stomach acid — suits women over 50 and anyone on acid reducers.' },
          { n: 'Carbonate', f: 'With food', d: 'Cheaper and more concentrated, but needs stomach acid.' }
        ],
        mix: 'The gut absorbs only about 500 mg at a time, so split a larger daily dose in two. Calcium competes for the same transporters as iron, zinc and magnesium — leave at least two hours between them. It does belong with vitamin D and K2: D governs absorption and K2 helps steer the calcium into bone rather than the artery wall.' }
    },
    b12: {
      cs: { intro: 'Rozdíl mezi formami je hlavně v tom, jak rychle je tělo využije.',
        list: [
          { n: 'Metylkobalamin', f: 'Běžné doplňování', d: 'Aktivní forma, tělo ji použije rovnou.' },
          { n: 'Kyanokobalamin', f: 'Levná varianta', d: 'Stabilní a nejvíc prozkoumaný; tělo si ho musí přeměnit.' },
          { n: 'Sublingvální', f: 'Porucha vstřebávání', d: 'Rozpouští se pod jazykem, obchází střevo.' }
        ],
        mix: 'Vysoké dávky jsou tu normální — bez vnitřního faktoru se z jedné porce vstřebá jen zlomek. Patří k ostatním vitaminům skupiny B, se kterými spolupracuje na stejné metabolické dráze, a ke kyselině listové zvlášť: samotný folát dokáže nedostatek B12 zamaskovat v krevním obraze, zatímco nervové poškození pokračuje. Ráno — večer může u citlivých žen rušit spánek. Metformin a léky na žaludeční kyselinu hladinu B12 dlouhodobě snižují.' },
      en: { intro: 'The forms differ mainly in how quickly the body can use them.',
        list: [
          { n: 'Methylcobalamin', f: 'Everyday use', d: 'The active form, used directly.' },
          { n: 'Cyanocobalamin', f: 'The cheap option', d: 'Stable and best studied; the body must convert it.' },
          { n: 'Sublingual', f: 'Absorption problems', d: 'Dissolves under the tongue, bypassing the gut.' }
        ],
        mix: 'High doses are normal here — without intrinsic factor only a fraction of any one dose is absorbed. It belongs with the other B vitamins it shares a pathway with, and with folate in particular: folate alone can mask a B12 deficiency in a blood count while nerve damage carries on. Morning, since evening can disturb sleep for some. Metformin and acid-reducing drugs lower B12 over time.' }
    },
    'omega-3': {
      cs: { intro: 'Omega-3, 6 a 9 nejsou tři verze téhož. Omega-3 a 6 jsou esenciální — tělo si je nevyrobí a navzájem soutěží o stejné enzymy. Omega-9 si tělo vyrobí samo. Proto „komplex 3-6-9" nedává smysl: přidává to, čeho máme dost, a ředí to, co nám chybí.',
        list: [
          { n: 'EPA (omega-3)', f: 'Nálada a záněty', d: 'Pro náladu se ve studiích používá 1 000 mg a víc denně, s převahou EPA nad DHA. Tlumí zánětlivé signály.' },
          { n: 'DHA (omega-3)', f: 'Mozek, oči, těhotenství', d: 'Stavební tuk mozku a sítnice. V těhotenství se doporučuje nejméně 200–300 mg denně navíc k rybám.' },
          { n: 'ALA (omega-3 z rostlin)', f: 'Lněné semínko, chia', d: 'Na EPA se přemění jen 5–10 %, na DHA pod 1 %. Ženy ale konvertují lépe než muži — estrogen tuhle přeměnu zvyšuje. Po menopauze výhoda mizí.' },
          { n: 'Kyselina linolová (omega-6)', f: 'Nedostatek nehrozí', d: 'Slunečnicový, sójový a řepkový olej jí mají dost. Problém není nedostatek, ale poměr k omega-3.' },
          { n: 'GLA (omega-6)', f: 'Jediná výjimka', d: 'Z pupalky a brutnáku. Tuhle konkrétní omega-6 tělo vyrábí špatně, proto se doplňuje na citlivá prsa a pleť.' },
          { n: 'Omega-9 (olivový olej)', f: 'Netřeba doplňovat', d: 'Kyselina olejová není esenciální — tělo si ji vyrobí. Tělo si ji umí vyrobit z jiných tuků, takže doplněk nemá co doplňovat — smysl dává jako olej v kuchyni.' },
          { n: 'Triglyceridová forma', f: 'Lepší vstřebání', d: 'Přirozená forma, vstřebá se o 50 % lépe než etylestery. Na obalu „rTG" nebo „triglyceride form".' },
          { n: 'Etylestery', f: 'Levnější', d: 'Nejčastější v levných doplňcích. Bez tučného jídla se vstřebá málo a rychleji žlukne.' },
          { n: 'Řasová DHA', f: 'Bez ryb', d: 'Rostlinný zdroj hotové DHA — vhodný pro veganky i v těhotenství, bez rizika těžkých kovů.' }
        ],
        mix: 'Západní strava má poměr omega-6 : omega-3 kolem 15:1, přitom evolučně je to 4:1 — proto dává větší smysl ubrat slunečnicový olej než přidat další kapsli. Vždy s tukem. Na obalu čtěte gramy EPA a DHA, ne celkovou hmotnost oleje. Vysoké dávky nad 3 g denně nekombinujte s warfarinem ani před operací. Olej skladujte v chladu a poznáte-li rybí říhání nebo zatuchlý pach, je zoxidovaný a spíš škodí. Stav se měří omega-3 indexem, cílem je 8–12 %.' },
      en: { intro: 'Omega-3, 6 and 9 are not three versions of one thing. Omega-3 and 6 are essential and compete for the same enzymes. Omega-9 the body makes itself. That is why a "3-6-9 complex" makes little sense: it adds what we already have too much of and dilutes what we lack.',
        list: [
          { n: 'EPA (omega-3)', f: 'Mood and inflammation', d: 'Mood studies use 1,000 mg or more daily, weighted towards EPA. It dampens inflammatory signalling.' },
          { n: 'DHA (omega-3)', f: 'Brain, eyes, pregnancy', d: 'The structural fat of brain and retina. In pregnancy at least 200–300 mg a day on top of fish.' },
          { n: 'ALA (plant omega-3)', f: 'Flax, chia', d: 'Only 5–10% converts to EPA and under 1% to DHA. Women convert better than men — estrogen raises conversion. That edge fades after menopause.' },
          { n: 'Linoleic acid (omega-6)', f: 'No shortage', d: 'Sunflower, soy and rapeseed oil supply plenty. The issue is not deficiency but the ratio to omega-3.' },
          { n: 'GLA (omega-6)', f: 'The one exception', d: 'From evening primrose and borage. The body makes this one poorly, hence its use for breast tenderness and skin.' },
          { n: 'Omega-9 (olive oil)', f: 'No need to supplement', d: 'Oleic acid is not essential — the body makes it. Good in food, pointless in a capsule.' },
          { n: 'Triglyceride form', f: 'Better absorption', d: 'The natural form absorbs about 50% better than ethyl esters. Look for "rTG" on the label.' },
          { n: 'Ethyl esters', f: 'Cheaper', d: 'Standard in budget brands. Absorbs poorly without fat and oxidises faster.' },
          { n: 'Algal DHA', f: 'Fish-free', d: 'A plant source of ready-made DHA — fine in pregnancy and for vegans, with no heavy metal risk.' }
        ],
        mix: 'Western diets run an omega-6 to omega-3 ratio near 15:1 where evolution set about 4:1 — so cutting seed oils often beats adding another capsule. Always with fat. Read the EPA and DHA grams, not the total oil weight. Above 3 g daily, avoid combining with warfarin or before surgery. Keep the oil cool; fishy burps or a stale smell mean it has oxidised and is doing more harm than good. Status is measured by the omega-3 index, target 8–12%.' }
    },
    folate: {
      cs: { intro: 'Tady se rozchází funkční a klasická medicína — a stojí za to vědět proč.',
        list: [
          { n: 'Kyselina listová', f: 'Prevence rozštěpu', d: 'Jediná forma s přímým důkazem, že snižuje riziko rozštěpu neurální trubice.' },
          { n: 'Metylfolát (5-MTHF)', f: 'Varianta MTHFR', d: 'Aktivní forma. Populární u výrobců, ale prevenci rozštěpu přímo prokázanou nemá.' }
        ],
        mix: 'Folát patří k vitaminu B12 — bez něj dokáže zamaskovat jeho nedostatek v krevním obraze, zatímco nervy trpí dál. Proto se kupují spolu. Varianta genu MTHFR není důvod se kyselině listové vyhýbat, tělo ji zpracovat umí. Zinek o vstřebávání soutěží jen při velmi vysokých dávkách. Ženy, které mohou otěhotnět, by měly mít 400 µg denně bez ohledu na formu.' },
      en: { intro: 'This is where functional and mainstream medicine diverge — and it is worth knowing why.',
        list: [
          { n: 'Folic acid', f: 'Neural tube prevention', d: 'The only form directly shown to prevent neural tube defects.' },
          { n: 'Methylfolate (5-MTHF)', f: 'MTHFR variants', d: 'The active form. Popular with brands, but without direct prevention evidence.' }
        ],
        mix: 'Folate belongs with vitamin B12 — on its own it can mask a B12 deficiency in a blood count while the nerves keep suffering. That is why they are bought together. An MTHFR variant is not a reason to avoid folic acid; the body can process it. Zinc competes for absorption only at very high doses. Anyone who could become pregnant needs 400 mcg daily either way.' }

    zinc: {

    'vitamin-d3': {

    collagen: { cs: ['Hydrolyzované peptidy, typ I a III na pleť, typ II na klouby.', 'Účinná dávka je 2,5–10 g denně — méně v „krásových" nápojích nestačí.', 'Vitamin C v kombinaci je funkční, ne ozdobný.'],
      en: ['Hydrolysed peptides: type I and III for skin, type II for joints.', 'The working dose is 2.5–10 g a day — beauty drinks with less do not reach it.', 'A vitamin C combination is functional, not decorative.'] },
    reishi: { cs: ['Musí být napsáno „extrakt z plodnice", ne mycelium na zrnu.', 'Hledejte obsah beta-glukanů nad 25 %, ne jen „polysacharidy".', 'Dvojitá extrakce (voda i alkohol) — u reishi bez ní přijdete o triterpeny.'],
      en: ['It must say "fruiting body extract", not mycelium on grain.', 'Look for beta-glucans above 25%, not just "polysaccharides".', 'Dual extraction (water and alcohol) — without it reishi loses its triterpenes.'] },
    coq10: { cs: ['Po čtyřicítce ubichinol, do té doby stačí ubichinon.', 'V olejové kapsli, ne v prášku — vstřebá se jinak mizivě.', 'Při statinech se dávka obvykle pohybuje výš, proberte ji s lékařem.'],
      en: ['Ubiquinol after 40; ubiquinone is fine before that.', 'In an oil capsule, not powder — otherwise absorption is negligible.', 'On statins the dose is usually higher; discuss it with your doctor.'] },
    b6: { cs: ['Forma P5P je aktivní a šetrnější k nervům.', 'Evropský strop je 12,5 mg denně — americké „PMS" produkty mívají 50–100 mg.', 'Zkontrolujte, kolik B6 už máte v multivitaminu.'],
      en: ['The P5P form is active and gentler on nerves.', 'The EU ceiling is 12.5 mg a day — American PMS products often carry 50–100 mg.', 'Check how much B6 your multivitamin already has.'] },
    selenium: { cs: ['Selenomethionin se vstřebává lépe než seleničitan.', 'Evropský strop je 255 µg denně — sečtěte i multivitamin a para ořechy.', 'Produkty „na štítnou žlázu" často kombinují selen z více zdrojů.'],
      en: ['Selenomethionine absorbs better than selenite.', 'The EU ceiling is 255 mcg a day — count your multivitamin and Brazil nuts too.', 'Thyroid support products often stack selenium from several sources.'] },
    inositol: { cs: ['Poměr 40:1 myo ku D-chiro je nejčastější, prášek vychází levněji než kapsle.', 'Denní dávka ve studiích je 2–4 g, což je několik kapslí — čtěte porci.', 'Kombinované PCOS produkty často obsahují i folát a chrom.'],
      en: ['A 40:1 myo to D-chiro ratio is standard; powder works out cheaper than capsules.', 'Study doses are 2–4 g a day, which is several capsules — read the serving size.', 'Combined PCOS products often add folate and chromium.'] },
    melatonin: { cs: ['Začněte na 0,5–1 mg. Studie pracují s 0,5–3 mg. Běžné 5mg tablety jsou nad tímto rozpětím a vyšší dávka neznamená rychlejší usnutí.', 'Klasická tableta na usnutí, prodloužené uvolňování na noční buzení.', 'V Česku je nad 2 mg na předpis — nižší dávky koupíte volně.'],
      en: ['Start at 0.5–1 mg. The usual 5 mg tablets are far more than most women need.', 'Immediate release for falling asleep, extended release for night waking.', 'Higher doses are prescription-only in much of Europe.'] },
    ashwagandha: { cs: ['Standardizovaný extrakt KSM-66 nebo Sensoril, ne mletý kořen.', 'KSM-66 je z kořene a spíš energizující, Sensoril i z listů a spíš tlumivý.', 'Vyhněte se, pokud berete léky na štítnou žlázu, bez konzultace.'],
      en: ['A standardised KSM-66 or Sensoril extract, not powdered root.', 'KSM-66 is root-only and more energising; Sensoril includes leaf and is more sedating.', 'Avoid without advice if you take thyroid medication.'] }
  };

  function buyBlock(item) {

    if (!b) return '';

      '<ul class="buy-list">' + b[lang].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></details>';
