  .stat-cell span { position: relative; z-index: 1; display: block; margin: 0 auto; text-align: center; font-size: 0.78rem; font-weight: 400; letter-spacing: .005em; color: rgba(255,255,255,.86); text-transform: none; line-height: 1.45; max-width: 20ch; }

  /* cycle hub */

  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border-lift); background: var(--surface); color: var(--ink-soft); transition: color .2s var(--ease), border-color .2s var(--ease); }

  .segmented { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; }
  .segmented button { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; padding: 7px 12px; border-radius: 999px; color: var(--ink-dim); transition: background .25s var(--ease), color .25s var(--ease); }

  /* ── hero ── */
  .hero { padding: 76px 0 34px; text-align: center; position: relative; isolation: isolate; }

  .hero p { color: var(--ink-soft); margin: 18px auto 0; max-width: 46ch; font-size: 1.05rem; line-height: 1.6; }
  .hero-search { position: relative; max-width: 520px; margin: 30px auto 0; text-align: left; }
  .hero-search .icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); width: 19px; height: 19px; }
  .hero-search input {
    width: 100%; padding: 17px 20px 17px 52px; border-radius: 999px;
    border: 1px solid var(--border-lift); background: var(--surface); color: var(--ink);

  }
  .hero-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow-m); }
  .hero-search input::placeholder { color: var(--ink-dim); }
  body[data-view="home"] .topbar .search-shell { display: none; }
  .hero-rule { height: 1px; background: var(--border); margin: 42px 0 0; }
  .section-label { display: block; text-align: center; font-family: var(--font-ui); font-weight: 600; font-size: clamp(1.6rem, 3.4vw, 2.15rem); line-height: 1.18; letter-spacing: -.025em; text-transform: none; color: var(--ink); margin-bottom: 0; }
  .section-sub { display: block; text-align: center; margin: 12px auto 30px; max-width: 54ch; font-size: 1rem; line-height: 1.6; color: var(--ink-soft); }

  /* ── guide invitation ── */
  .guide-card {
    width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 36px 32px 32px; border-radius: var(--r-xl); margin: 34px auto 52px; max-width: 720px;

  }

  .guide-art { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); flex-shrink: 0; }
  .guide-art { color: #fff; }
  .guide-art .art { width: 40px; height: 40px; }

  /* ── "do you recognise yourself" panel ── */

  .feels-head { text-align: center; font-family: var(--font-ui); font-style: normal; font-weight: 600; font-size: clamp(1.6rem, 3.4vw, 2.15rem); line-height: 1.18; letter-spacing: -.025em; }

  .concerns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 1000px) { .concerns { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 680px) { .concerns { grid-template-columns: 1fr; } }
  .concern {
    display: flex; align-items: center; gap: 15px; padding: 18px 20px; text-align: left; width: 100%;

  }

    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--o) 24%, transparent), 0 6px 16px color-mix(in srgb, var(--o) 28%, transparent);
    transition: box-shadow .26s var(--ease), transform .26s var(--ease); }

    box-shadow: 0 2px 6px rgba(30,10,20,.07), 0 16px 40px color-mix(in srgb, var(--c) 36%, transparent); }
  
  .concern:hover .icon { transform: translateX(4px); color: var(--c); }

  /* ── world cards — colour-blocked ── */
  .worlds { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 8px; }
  .world { flex: 0 1 330px; }

  .world {
    display: flex; flex-direction: column; border-radius: var(--r-xl); overflow: hidden; isolation: isolate;
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--c) 22%, var(--border));
    box-shadow: 0 1px 2px rgba(30,10,20,.05), 0 10px 28px color-mix(in srgb, var(--c) 17%, transparent);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
  }
  .world:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow: 0 2px 6px rgba(30,10,20,.07), 0 18px 46px color-mix(in srgb, var(--c) 38%, transparent); }
  .world-head { position: relative; display: block; width: 100%; text-align: left; cursor: pointer; padding: 0; }

  .world-banner .photo { border-radius: 0; box-shadow: none; }

  .world:hover .banner-ring { transform: rotate(14deg) scale(1.04); }
  .crescent { width: 88px; height: 88px; filter: drop-shadow(0 4px 16px rgba(22,6,15,.45)); }

  .world-head .go { position: absolute; right: 14px; bottom: 13px; width: 36px; height: 36px; border-radius: 50%;

  .world-peek { display: flex; flex-direction: column; padding: 2px 20px 14px; }

  .peek { display: flex; align-items: center; gap: 11px; width: 100%;

  .peek-more { color: var(--c); font-weight: 600; }
  .peek:hover { color: var(--c); padding-left: 5px; }
  .peek:hover .icon { opacity: 1; transform: translateX(3px); }

  /* ── page head ── */

    transition: color .2s var(--ease), border-color .2s var(--ease); }

  .card { position: relative; border-radius: var(--r-lg); background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 18%, var(--border));
    box-shadow: 0 1px 2px rgba(30,10,20,.05), 0 8px 24px color-mix(in srgb, var(--c) 14%, transparent);
    transition: transform .28s var(--ease), border-color .28s var(--ease), background .28s var(--ease); }

  .card:hover::after { opacity: 1; transform: rotate(45deg) translate(2px, -2px); border-color: var(--c); }

  .card-head { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card-glyph .art { width: 27px; height: 27px; }

  .sheet-glyph .art { width: 34px; height: 34px; }
  .row-glyph .art { width: 24px; height: 24px; }
  .concern-art .art { width: 24px; height: 24px; }
  .card-glyph { width: 44px; height: 44px; flex-shrink: 0; }

  .card-glyph .art { width: 29px; height: 29px; }
  .card-name { font-family: var(--font-ui); font-weight: 600; font-size: 1.16rem; line-height: 1.2; letter-spacing: -.02em; }

  /* stat tiles — dose / timing / evidence */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }

  .helps-label { display: block; font-size: 0.64rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .helps { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: -4px; }

    border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); }
  .helps-lg { margin: 0 0 18px; padding: 14px; border-radius: var(--r-md);

    background: var(--surface); border-color: color-mix(in srgb, var(--c) 38%, transparent);

  .card-blurb { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 0.84rem; line-height: 1.5; color: var(--ink-soft); }
  .card-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .cm { display: inline-flex; align-items: center; gap: 5px; font-size: 0.68rem; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; color: var(--ink-soft); background: var(--surface-2); }
  .cm .icon { width: 12px; height: 12px; }

  .cm-care { background: color-mix(in srgb, var(--gold) 15%, var(--surface)); color: color-mix(in srgb, var(--gold) 82%, var(--ink)); }
  .cm-avoid { background: color-mix(in srgb, var(--coral) 14%, var(--surface)); color: color-mix(in srgb, var(--coral) 80%, var(--ink)); }
  .card-topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .ct { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: var(--ink-soft);
    background: color-mix(in srgb, var(--c) 9%, var(--surface-2)); }
  .card-grade { position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.68rem; font-weight: 700; color: #fff; background: var(--gc); opacity: .9; }

  .pair-line b { font-size: 0.92rem; font-weight: 600; color: var(--d4); }
  .why { display: block; font-size: 0.76rem; line-height: 1.45; color: color-mix(in srgb, var(--c) 62%, var(--ink)); font-weight: 600; }

  .topic-hits { text-align: center; margin: 4px 0 26px; }
  .hit-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hit { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px 9px 9px; border-radius: 999px;
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 26%, var(--border));
    font-size: 0.88rem; font-weight: 600; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 16%, transparent);
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .hit:hover { transform: translateY(-2px); border-color: var(--c); box-shadow: 0 8px 22px color-mix(in srgb, var(--c) 32%, transparent); }
  .hit-dot { width: 22px; height: 22px; flex-shrink: 0; }
  .rows { display: flex; flex-direction: column; gap: 8px; max-width: 720px; margin: 0 auto; width: 100%; }
  /* a desaturated sage at 13% over white is invisible against the page, so the
     colour is carried by a deepened mix and a solid glyph tile instead */
  .row { --cs: color-mix(in srgb, var(--c) 72%, var(--ink));
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; box-shadow: var(--shadow-s);
    padding: 12px 52px 12px 18px; border-radius: var(--r-md);
    background: color-mix(in srgb, var(--cs) 15%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--cs) 34%, transparent);
    transition: border-color .24s var(--ease), background .24s var(--ease); }
  /* a colour edge so each herb reads as belonging to its area */
  .row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--cs); }
  .row .row-name { color: var(--cs); }
  .row .row-glyph { background: var(--cs); border-color: transparent; color: #fff; }
  .row:hover { border-color: var(--cs);
    background: color-mix(in srgb, var(--cs) 24%, var(--surface)); }
  .row-glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; color: var(--c);
    background: color-mix(in srgb, var(--c) 17%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
  .row-glyph .art { width: 26px; height: 26px; }
  .row-name { font-family: var(--font-ui); font-weight: 700; font-size: 1.1rem; }
  .row-meta { font-size: 0.72rem; color: var(--ink-dim); }
  .row-dose { margin-left: auto; text-align: right; font-family: var(--font-ui); font-size: 1rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .bookmark { position: absolute; top: 10px; right: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-dim); transition: color .2s var(--ease), background .2s var(--ease); }
  .row .bookmark { top: 50%; transform: translateY(-50%); right: 10px; }
  .bookmark .icon { width: 17px; height: 17px; }
  .bookmark:hover { background: var(--surface-3); color: var(--ink-soft); }
  .bookmark[aria-pressed="true"] { color: var(--accent); }
  .bookmark[aria-pressed="true"] .icon { fill: currentColor; }
  .empty { text-align: center; padding: 54px 20px; color: var(--ink-soft); }
  .empty .serif { display: block; font-size: 1.4rem; color: var(--ink); margin-bottom: 6px; }

  /* ── dotted ring ── */
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 26px 0 8px; }
  .ring { width: min(280px, 72vw); height: auto; }
  .ring-center { text-align: center; }
  .ring-n { font-family: var(--font-ui); font-size: 2.6rem; line-height: 1; }
  .ring-label { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .ring-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .ring-legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 0.76rem; color: var(--ink-soft); }
  .ring-legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--lc); display: block; }

  /* ── quiz ── */
  .quiz { padding: 34px 0 20px; max-width: 760px; margin: 0 auto; }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .quiz-top .btn-text { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
  .quiz-top .btn-text .icon { width: 15px; height: 15px; }
  .quiz-step { font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-bottom: 30px; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .45s var(--ease); }
  .quiz-count { text-align: center; margin: 16px 0 0; font-size: .8rem; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .option-check { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--border-lift); display: grid; place-items: center; transition: background .2s var(--ease), border-color .2s var(--ease); }
  .option-check .icon { width: 13px; height: 13px; color: #fff; opacity: 0; stroke-width: 2.6; transition: opacity .2s var(--ease); }
  .option[aria-pressed="true"] .option-check { background: var(--accent); border-color: var(--accent); }
  .option[aria-pressed="true"] .option-check .icon { opacity: 1; }
  .option-key { position: absolute; bottom: 8px; left: 10px; font-size: .62rem; font-weight: 700; color: var(--ink-dim); opacity: .55; }
  .progress { display: none; }
  .progress i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-lift); display: block; transition: all .3s var(--ease); }
  .progress i.on { background: var(--accent); }
  .progress i.now { width: 26px; border-radius: 999px; background: var(--accent); }
  .quiz h2 { font-family: var(--font-ui); font-style: normal; font-weight: 600; font-size: clamp(1.7rem, 3.6vw, 2.2rem); text-align: center; line-height: 1.18; letter-spacing: -.025em; }
  .quiz h2 em { font-family: var(--font-ui); font-weight: 700; }
  .quiz .hint { text-align: center; color: var(--ink-dim); font-size: 0.88rem; margin: 10px 0 0; }
  .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 11px; margin: 28px 0 0; }
  .option { flex: 0 1 168px; }
  @media (max-width: 480px) { .option { flex: 0 1 44%; } }
  .option { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 14px 20px; border-radius: var(--r-lg);
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--oc) 20%, var(--border));
    box-shadow: 0 1px 2px rgba(30,10,20,.05), 0 8px 22px color-mix(in srgb, var(--oc) 14%, transparent);
    transition: transform .24s var(--ease), border-color .24s var(--ease), box-shadow .24s var(--ease); }
  .option:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--oc) 55%, transparent);
    box-shadow: 0 2px 6px rgba(30,10,20,.07), 0 16px 38px color-mix(in srgb, var(--oc) 34%, transparent); }
  .option:active { transform: scale(.97); }
  .option-glyph { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: var(--oc);
    background: color-mix(in srgb, var(--oc) 16%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--oc) 32%, transparent); }
  .option-glyph .art { width: 33px; height: 33px; }
  .option-name { font-size: 0.86rem; font-weight: 600; text-align: center; line-height: 1.25; }
  .option[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 16px 40px color-mix(in srgb, var(--accent) 30%, transparent); }
  .quiz-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 999px; font-weight: 700; font-size: 0.92rem;
    background: var(--accent); color: #fff; transition: transform .2s var(--ease), opacity .2s var(--ease); }
  .btn-primary:active { transform: scale(.97); }
  .btn-text { font-size: 0.86rem; font-weight: 600; color: var(--ink-dim); text-decoration: underline; text-underline-offset: 3px; }

  .plan-note { display: flex; gap: 11px; align-items: flex-start; text-align: left; max-width: 62ch; margin: 22px auto 6px; padding: 15px 17px; border-radius: var(--r-md);
    background: var(--surface); border: 1px solid var(--border-lift); }
  .plan-note .icon { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; color: var(--gold); }
  .plan-note p { margin: 0; font-size: 0.84rem; color: var(--ink-soft); }
  .plan-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 32px; align-items: center; justify-content: center; }
  #plan-answers { margin-top: 20px; text-align: center; }
  #plan-answers .answer-chips { justify-content: center; }
  .answer-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .answer-chip { font-size: 0.78rem; font-weight: 600; padding: 7px 14px; border-radius: 999px; color: var(--ink-soft);
    background: color-mix(in srgb, var(--ac) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ac) 34%, transparent); }


  /* ── show less at once, without hiding anything for good ── */
  .concerns-more { display: none; }
  /* the topic list is folded at every width; the card stays a card */
  .world-peek { display: none; gap: 0; padding: 2px 14px 14px; }
  .world.peek-open .world-peek { display: flex; }
  .peek-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 14px 20px; font-size: 0.84rem; font-weight: 700; color: var(--c);
    border-top: none; background: none; }
  .peek-toggle:hover { background: color-mix(in srgb, var(--c) 8%, transparent); }
  .world-peek .peek { border-top: none; border-radius: 10px; padding: 10px 12px;
    background: transparent; border: 1px solid transparent;
    color: var(--ink); font-weight: 600; font-size: 0.92rem;
    transition: background .18s var(--ease), border-color .18s var(--ease), padding-left .18s var(--ease); }
  .world-peek .peek + .peek { margin-top: -1px; }
  .world-peek .peek:hover { background: color-mix(in srgb, var(--c) 14%, var(--surface));
    border-color: color-mix(in srgb, var(--c) 30%, transparent);
    color: color-mix(in srgb, var(--c) 55%, var(--ink)); padding-left: 16px; }
  .world-peek .peek-dot { width: 15px; height: 15px; }
  /* a hairline between rows instead of twelve filled blocks */
  .world-peek .peek:not(:last-child)::after { content: ''; position: absolute; left: 12px; right: 12px;
    bottom: -1px; height: 1px; background: var(--border); }
  .world-peek .peek { position: relative; }
  .world-peek .peek:hover::after { opacity: 0; }
  /* every card in a row matches the tallest, open or shut */
  .worlds { align-items: stretch; }
  .world { justify-content: flex-start; }
  .world .world-copy { flex: 1 1 auto; }
  @media (max-width: 720px) {
    .concerns.clipped .concern:nth-child(n+7) { display: none; }
    .concerns-more { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      grid-column: 1 / -1; margin-top: 4px; padding: 13px 20px; border-radius: 999px;
      font-size: 0.86rem; font-weight: 700; color: var(--ink-soft);
      background: var(--surface); border: 1px solid var(--border-lift); }
    .concerns-more::after { content: ''; width: 7px; height: 7px; border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor; transform: rotate(45deg) translate(-2px, -2px);
      transition: transform .24s var(--ease); }
    .concerns-more[aria-expanded="true"]::after { transform: rotate(-135deg) translate(-2px, -2px); }
    .concern { padding: 15px 17px; }
    .concern-art { width: 34px; height: 34px; }
    .concern-text { font-size: 0.95rem; }
    .world-peek .peek-dot { width: 22px; height: 22px; }
    .peek-toggle::after { content: ''; width: 8px; height: 8px; border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor; margin-bottom: 3px;
      transform: rotate(45deg); transition: transform .24s var(--ease); }
    .world.peek-open .peek-toggle::after { transform: rotate(225deg); margin: 3px 0 0; }
    /* the per-topic arrows inside the list are redundant next to the toggle */
    .world-peek .peek .icon { display: none; }
    .world-banner { height: 118px; }
    /* the round arrow on the banner duplicated the toggle chevron below it */
    .world-head .go { display: none; }
    .world-name { font-size: 1.34rem; }
  }

  /* ── consent ── */
  .consent { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 140%); z-index: 90;
    width: min(620px, calc(100% - 32px)); display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 18px 22px; border-radius: var(--r-lg); background: var(--surface);
    border: 1px solid var(--border-lift); box-shadow: var(--shadow-l);
    transition: transform .45s var(--ease); }
  .consent[data-in="true"] { transform: translate(-50%, 0); }
  .consent p { margin: 0; flex: 1 1 280px; font-size: 0.84rem; line-height: 1.55; color: var(--ink-soft); }
  .consent-btns { display: flex; gap: 8px; margin-left: auto; }
  .consent button { padding: 10px 18px; border-radius: 999px; font-size: 0.83rem; font-weight: 700; white-space: nowrap; }
  .c-no { color: var(--ink-soft); border: 1px solid var(--border-lift); }
  .c-no:hover { color: var(--accent); border-color: var(--accent); }
  .c-yes { background: var(--dark); color: #fff; }
  .c-yes:hover { background: var(--accent); }

  /* ── sources ── */
  .sources { padding: 10px 0 0; }
  .sources .wrap { max-width: 760px; }
  .sources details { border-top: 1px solid var(--border); padding-top: 14px; }
  .sources summary { list-style: none; cursor: pointer; text-align: center; font-size: 0.82rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); padding: 8px 0; }
  .sources summary::-webkit-details-marker { display: none; }
  .sources summary:hover { color: var(--accent); }
  .sources summary::after { content: ' +'; }
  .sources details[open] summary::after { content: ' \2212'; }
  .src-intro { max-width: 60ch; margin: 10px auto 26px; text-align: center; font-size: 0.86rem;
    line-height: 1.6; color: var(--ink-soft); }
  .sources .meta-label { text-align: center; }
  .src-gap { margin-top: 34px; }
  .src-list { display: flex; flex-direction: column; }
  .src-row { display: flex; gap: 16px; align-items: baseline; padding: 13px 0; border-top: 1px solid var(--border);
    text-decoration: none; color: inherit; transition: background .2s var(--ease); }
  .src-row:hover { background: var(--surface-2); }
  .src-row:hover .src-what { color: var(--accent); }
  .src-row:first-child { border-top: none; }
  .src-year { flex: 0 0 52px; font-family: var(--font-display); font-style: italic; font-size: 1.05rem;
    color: var(--accent); font-variant-numeric: tabular-nums; }
  .src-main { display: block; }
  .src-main b { display: block; font-size: 0.9rem; }
  .src-what { display: block; margin-top: 3px; font-size: 0.88rem; line-height: 1.55; color: var(--ink); }
  .src-meta { display: block; margin-top: 4px; font-size: 0.76rem; color: var(--ink-dim); }
  .src-people { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .src-books { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
  .src-book b { display: block; font-size: 0.88rem; }
  .src-book span { font-size: 0.78rem; color: var(--ink-soft); }

  /* ── sheet ── */
  .scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; background: rgba(42,12,30,.44); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s var(--ease), visibility 0s linear .3s; }
  .scrim[data-open="true"] { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .3s var(--ease), visibility 0s; }
  @media (min-width: 620px) { .scrim { place-items: center; } }
  .sheet { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-lift);
    border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 24px 22px 28px; box-shadow: var(--shadow-l);
    transform: translateY(24px); opacity: 0; transition: transform .34s var(--ease), opacity .28s var(--ease); }
  @media (min-width: 620px) { .sheet { border-radius: var(--r-xl); } }

  .sheet-glyph { width: 56px; height: 56px; flex-shrink: 0; }

  .sheet-close { position: absolute; top: -4px; right: -4px; width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: var(--surface-2); color: var(--ink-soft); display: grid; place-items: center; }
  .sheet-close .icon { width: 16px; height: 16px; }
  .dose-panel { padding: 18px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 14px; text-align: center; }
  .dose-panel .stats { margin-top: 10px; }
  .dose-panel .stat { background: var(--surface); }
  .sheet p.body { color: var(--ink); font-size: 0.95rem; line-height: 1.68; margin: 0 auto; text-align: left; max-width: 52ch; }
  .what-list { display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .what-point { display: flex; gap: 12px; align-items: flex-start; padding: 12px 2px; border-top: 1px solid var(--border); }
  .what-point:first-child { border-top: none; padding-top: 4px; }
  .wp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex-shrink: 0; margin-top: 8px; opacity: .8; }
  .what-point p { margin: 0; font-size: 0.93rem; line-height: 1.62; color: var(--ink); }
  .buy-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .buy-list li { position: relative; padding-left: 26px; font-size: 0.9rem; line-height: 1.55; color: var(--ink); }
  .buy-list li::before { content: ''; position: absolute; left: 3px; top: 4px; width: 13px; height: 8px;
    border-left: 2px solid var(--moss); border-bottom: 2px solid var(--moss); transform: rotate(-45deg); }
  .buy { background: color-mix(in srgb, var(--moss) 6%, var(--surface)); border-color: color-mix(in srgb, var(--moss) 24%, var(--border)); }
  .note-box { display: flex; gap: 10px; text-align: left; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface-2);
    border: 1px solid var(--border-lift); margin-bottom: 18px; }
  .note-box strong { color: var(--gold); }
  .note-box .icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--gold); margin-top: 2px; }
  .note-box p { margin: 0; font-size: 0.86rem; color: var(--ink-soft); }
  .meta-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 9px; }

  .forms { text-align: left; }
  .forms-intro { margin: 0 0 14px; font-size: 0.9rem; line-height: 1.6; color: var(--ink-soft); }
  .form-list { display: flex; flex-direction: column; gap: 2px; }
  .form-row { padding: 12px 0; border-top: 1px solid var(--border); }
  .form-row:first-child { border-top: none; }
  .form-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .form-top b { font-size: 0.94rem; font-weight: 700; color: var(--ink); }
  .form-top span { font-size: 0.7rem; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    color: color-mix(in srgb, var(--c) 76%, var(--ink)); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
  .form-row p { margin: 5px 0 0; font-size: 0.86rem; line-height: 1.55; color: var(--ink-soft); }
  .mix-box { display: block; margin-top: 16px; padding: 15px 16px; border-radius: var(--r-md);
    background: color-mix(in srgb, var(--coral) 9%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--coral) 24%, transparent); }
  .mix-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .mix-box .icon { width: 17px; height: 17px; flex-shrink: 0; color: var(--coral); }
  .mix-points { display: flex; flex-direction: column; gap: 2px; }
  .mix-point { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid color-mix(in srgb, var(--coral) 16%, transparent); }
  .mix-point:first-child { border-top: none; padding-top: 0; }
  .mp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); flex-shrink: 0; margin-top: 7px; opacity: .85; }
  .persp-points { display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .persp-point { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--border); }
  .persp-point:first-child { border-top: none; padding-top: 2px; }

      d: { v: '90–120', u: 'µg', per: 'daily' },
      topics: ['peri','meno','bone','heart','poi'],
      cs: { name: 'Vitamin K2', blurb: 'Pomáhá poslat vápník do kostí místo do cév. Dobře se doplňuje s vitaminem D.', note: 'Pokud berete léky na ředění krve, nejdřív se zeptejte lékaře.' },
      en: { name: 'Vitamin K2', blurb: 'Helps send calcium into bone instead of arteries. Pairs well with vitamin D.', note: 'Ask your doctor first if you take blood thinners.' } },

    { id: 'collagen', art: 'skin', key: 'skin', tier: 'support', when: 'any', food: 'any', ev: 2,
      d: { v: '2,5–15', u: 'g', per: 'daily' },
      topics: ['adult25','peri','meno','skin','bone','recovery','hair','poi'],
      cs: { name: 'Kolagen', blurb: 'Podpora pružnosti pleti a pohodlí kloubů ve chvíli, kdy vlastní tvorba zpomaluje.', note: 'Nejlepší důkazy má hydratace pleti. Účinek se buduje 8–12 týdnů, ne přes noc.' },
      en: { name: 'Collagen', blurb: 'Supports skin elasticity and joint comfort as your own production slows.', note: 'Best evidence is for skin hydration. It builds over 8–12 weeks, not overnight.' } },

    { id: 'biotin', art: 'hair', key: 'hair', tier: 'support', when: 'any', food: 'any', ev: 1,
      d: { v: '30', u: 'µg', per: 'daily' },
      topics: ['teens','adult25','hair','postpartum'],
      cs: { name: 'Biotin', blurb: 'Součást keratinu, ze kterého jsou vlasy a nehty. Pomáhá hlavně tam, kde opravdu chybí.', note: 'Vysoké dávky zkreslují krevní testy štítné žlázy — zmiňte je před odběrem.' },
      en: { name: 'Biotin', blurb: 'Part of the keratin in hair and nails. It mainly helps if you are actually short.', note: 'High doses skew thyroid blood tests — mention it before testing.' } },

    { id: 'probiotics', art: 'gut', key: 'gut', tier: 'support', when: 'morning', food: 'empty', ev: 2,
      d: { v: '1–20', u: 'mld. CFU', per: 'daily' },
      topics: ['pregnancy','postpartum','adult25','gut','immunity','skin','endo','acne'],
      cs: { name: 'Probiotika', blurb: 'Podpora střevní rovnováhy a se správnými kmeny i poševního mikrobiomu.', note: 'Důležitější než počet bakterií je konkrétní kmen — hledejte ten zkoumaný pro váš cíl.' },
      en: { name: 'Probiotics', blurb: 'Support gut balance and, with the right strains, the vaginal microbiome.', note: 'The strain matters more than the count — look for one studied for your goal.' } },

    { id: 'coq10', art: 'energy', key: 'energy', tier: 'support', when: 'morning', food: 'with', ev: 2,
      d: { v: '100–200', u: 'mg', per: 'daily' },
      topics: ['preconception','peri','meno','heart','energy','hiit','pcos'],
      cs: { name: 'Koenzym Q10', blurb: 'Pohání energii v buňkách. Zkoumaný pro kvalitu vajíček i zdraví srdce.', note: 'Forma ubichinol se po čtyřicítce obvykle vstřebává lépe.' },
      en: { name: 'CoQ10', blurb: 'Powers energy inside cells. Studied for egg quality and heart health.', note: 'The ubiquinol form usually absorbs better after 40.' } },

    { id: 'selenium', art: 'hormonal', key: 'hormonal', tier: 'support', when: 'any', food: 'with', ev: 2,
      d: { v: '55–70', u: 'µg', per: 'daily' },
      topics: ['pregnancy','peri','hormonal','immunity','thyroid'],
      cs: { name: 'Selen', blurb: 'Štítná žláza ho potřebuje, aby svůj hormon přepnula do aktivní formy.', note: 'Bezpečné rozmezí je úzké — nekombinujte para ořechy a doplněk naráz.' },
      en: { name: 'Selenium', blurb: 'The thyroid needs it to switch its hormone into the active form.', note: 'The safe range is narrow — do not stack Brazil nuts with a supplement.' } },

    { id: 'inositol', art: 'reproductive', key: 'cycle', tier: 'support', when: 'morning', food: 'any', ev: 2,
      d: { v: '2–4', u: 'g', per: 'daily' },
      topics: ['cycle','preconception','adult25','hormonal','pcos','acne'],
      cs: { name: 'Myo-inositol', blurb: 'Zkoumaný na podporu ovulace a citlivost na inzulin, hlavně u PCOS.', note: 'Obvykle dobře snášený, na horní hranici dávky může zlobit trávení.' },
      en: { name: 'Myo-inositol', blurb: 'Studied for ovulation support and insulin sensitivity, mainly in PCOS.', note: 'Usually well tolerated; the top of the range can upset digestion.' } },

    { id: 'l-theanine', art: 'herbsCalm', key: 'herbsCalm', tier: 'support', when: 'any', food: 'any', ev: 2,
      d: { v: '100–200', u: 'mg', per: 'daily' },
      topics: ['adult25','stress','mind','sleep','herbsCalm','nerves'],
      cs: { name: 'L-theanin', blurb: 'Aminokyselina ze zeleného čaje. Zklidní, ale neuspí — často se pojí s kávou.', note: 'Dobře snášený. Účinek je jemný, ne dramatický.' },
      en: { name: 'L-theanine', blurb: 'An amino acid from green tea. Calms without making you sleepy — often paired with coffee.', note: 'Well tolerated. The effect is gentle, not dramatic.' } },

    { id: 'melatonin', art: 'sleep', key: 'sleep', tier: 'support', when: 'evening', food: 'any', ev: 3,
      d: { v: '0,5–3', u: 'mg', per: 'beforeBed' },
      topics: ['adult25','peri','meno','sleep'],
      cs: { name: 'Melatonin', blurb: 'Krátkodobá pomoc s usínáním, když noc ruší návaly nebo myšlenky na plný plyn.', note: 'Začněte tou nejnižší dávkou. Ranní malátnost znamená, že je jí moc.' },
      en: { name: 'Melatonin', blurb: 'Short-term help falling asleep when flashes or racing thoughts break the night.', note: 'Start at the lowest dose. Morning grogginess means it is too much.' } },

    { id: 'reishi', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'evening', food: 'any', ev: 2,
      d: { v: '1–1,5', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','sleep','stress','immunity','adaptogens','mind'],
      cs: { name: 'Reishi', blurb: 'V čínské medicíně „houba nesmrtelnosti" (ling-č\'). Dnes se zkoumá pro spánek, zklidnění a podporu imunity.', note: 'Hořká chuť je znakem kvality — pochází z triterpenů. Může mírně ředit krev, pozor při antikoagulanciích.' },
      en: { name: 'Reishi', blurb: 'The "mushroom of immortality" in Chinese medicine. Studied today for sleep, calm and immune support.', note: 'The bitterness is a quality marker — it comes from triterpenes. It can thin blood slightly; care with anticoagulants.' } },

    { id: 'lions-mane', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'morning', food: 'any', ev: 2,
      d: { v: '1–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','nerves','mind','stress','adaptogens','mito'],
      cs: { name: 'Korálovec (Lion\'s Mane)', blurb: 'Jediná houba zkoumaná pro růst nervových buněk — stimuluje tvorbu NGF, růstového faktoru nervů.', note: 'Účinek se buduje týdny, ne dny. U citlivých lidí zpočátku svědění kůže — to je hlášený, ale vzácný efekt.' },
      en: { name: 'Lion\'s Mane', blurb: 'The one mushroom studied for nerve growth — it stimulates NGF, the nerve growth factor.', note: 'Effects build over weeks, not days. Some report mild skin itching at first — reported but uncommon.' } },

    { id: 'cordyceps', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'morning', food: 'any', ev: 2,
      d: { v: '1–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','energy','hiit','recovery','adaptogens','mito'],
      cs: { name: 'Cordyceps', blurb: 'V TCM houba na „doplnění plic a ledvin". Dnes se zkoumá pro využití kyslíku a vytrvalostní výkon.', note: 'Kupujte CS-4 nebo militaris — divoký cordyceps sinensis je extrémně drahý a často falšovaný. Ne večer, může budit.' },
      en: { name: 'Cordyceps', blurb: 'In Chinese medicine a mushroom to "tonify lung and kidney". Studied now for oxygen use and endurance.', note: 'Buy CS-4 or militaris — wild cordyceps sinensis is extremely expensive and often faked. Not in the evening, it can keep you up.' } },

    { id: 'tremella', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'any', food: 'any', ev: 1,
      d: { v: '1–2', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','skin','hair','adaptogens'],
      cs: { name: 'Tremella (stříbrné ucho)', blurb: 'Houba, kterou čínské císařovny používaly na pleť. Její polysacharidy vážou vodu podobně jako kyselina hyaluronová.', note: 'Dat u lidí je málo, většina studií je laboratorních. Dobře snášená, nejčastěji jako prášek do nápojů.' },
      en: { name: 'Tremella (snow fungus)', blurb: 'The mushroom Chinese empresses used for their skin. Its polysaccharides hold water much like hyaluronic acid.', note: 'Human data is thin, most studies are lab-based. Well tolerated, usually taken as a powder in drinks.' } },

    { id: 'chaga', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'morning', food: 'any', ev: 1,
      d: { v: '1–2', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','immunity','skin','adaptogens','gut'],
      cs: { name: 'Chaga', blurb: 'Sibiřská „houba nesmrtelnosti" rostoucí na břízách. Nejvyšší naměřená antioxidační kapacita ze všech hub.', note: 'Obsahuje oxaláty — při sklonu k ledvinovým kamenům opatrně a ne dlouhodobě denně. Tradičně se vaří jako čaj, ne jí.' },
      en: { name: 'Chaga', blurb: 'The Siberian "mushroom of immortality" that grows on birch. The highest measured antioxidant capacity of any mushroom.', note: 'High in oxalates — go carefully with a history of kidney stones, and not daily long term. Traditionally simmered as tea, never eaten raw.' } },

    { id: 'turkey-tail', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'any', food: 'any', ev: 2,
      d: { v: '2–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','immunity','gut','adaptogens'],
      cs: { name: 'Outkovka pestrá', blurb: 'Nejlépe prozkoumaná léčivá houba vůbec. Její frakce PSK je v Japonsku registrovaná jako doplňková léčba a podává se souběžně s onkologickou péčí.', note: 'To neznamená, že houba léčí rakovinu — jde o doplněk k léčbě, vždy pod dohledem lékaře. Zároveň je silné prebiotikum pro střevo.' },
      en: { name: 'Turkey tail', blurb: 'The best-researched medicinal mushroom there is. Its PSK fraction is registered in Japan as an adjuvant given alongside cancer care.', note: 'That does not mean the mushroom treats cancer — it is an adjunct used under medical supervision. It is also a strong gut prebiotic.' } },

    { id: 'shiitake', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'any', food: 'with', ev: 2,
      d: { v: '1–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','immunity','heart','gut','adaptogens'],
      cs: { name: 'Shiitake', blurb: 'Jediná z léčivých hub, která je zároveň běžnou potravinou. Její lentinan se zkoumá pro imunitu, eritadenin pro cholesterol.', note: 'U citlivých lidí může syrová nebo nedovařená způsobit „shiitake dermatitidu" — pruhovitou vyrážku. Tepelná úprava problém řeší.' },
      en: { name: 'Shiitake', blurb: 'The one medicinal mushroom that is also an everyday food. Lentinan is studied for immunity, eritadenin for cholesterol.', note: 'Raw or undercooked it can cause "shiitake dermatitis" — a striped rash — in sensitive people. Cooking solves it.' } },

    { id: 'maitake', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'morning', food: 'any', ev: 2,
      d: { v: '1–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','immunity','pcos','hormonal','adaptogens'],
      cs: { name: 'Maitake', blurb: 'Houba zvaná „tančící" — podle radosti sběračů, kteří ji našli. Její D-frakce se zkoumá pro imunitu a u PCOS pro podporu ovulace.', note: 'Může snižovat krevní cukr — při cukrovce nebo lécích na glykémii konzultujte s lékařem.' },
      en: { name: 'Maitake', blurb: 'The "dancing mushroom", named for the joy of those who found it. Its D-fraction is studied for immunity and, in PCOS, for ovulation.', note: 'It can lower blood sugar — check with a doctor if you are diabetic or on glucose medication.' } },

    { id: 'poria', art: 'adaptogens', key: 'mushrooms', tier: 'adapto', when: 'evening', food: 'any', ev: 1,
      d: { v: '1–3', u: 'g extraktu', per: 'daily' },
      topics: ['mushrooms','sleep','stress','gut','adaptogens'],
      cs: { name: 'Poria (fu-ling)', blurb: 'Jedna z nejčastějších bylin celé čínské medicíny. Tradičně „odvádí vlhkost", zklidňuje mysl a podporuje trávení.', note: 'Mírně močopudná. Klinických studií je málo, většina znalostí pochází z tisícileté praxe TCM receptur.' },
      en: { name: 'Poria (fu ling)', blurb: 'One of the most prescribed herbs in all of Chinese medicine. Traditionally it "drains dampness", calms the mind and settles digestion.', note: 'Mildly diuretic. Clinical studies are few; most knowledge comes from a millennium of TCM formulas.' } },

    { id: 'nad', art: 'energy', key: 'mito', tier: 'support', when: 'morning', food: 'any', ev: 1,
      d: { v: '250–500', u: 'mg', per: 'daily' },
      topics: ['mito','energy','peri','meno','mind'],
      cs: { name: 'NMN a NR (NAD+)', blurb: 'Suroviny pro NAD+ — molekulu, bez které buňka nevyrobí energii. Její hladina s věkem klesá zhruba na polovinu.', note: 'U myší působivé, u lidí zatím malé studie. Drahé. Zvyšuje NAD+ v krvi, ale že se tím zpomalí stárnutí, prokázané není.' },
      en: { name: 'NMN and NR (NAD+)', blurb: 'Raw material for NAD+, the molecule a cell needs to make energy. Levels roughly halve with age.', note: 'Impressive in mice, small human studies so far. Expensive. It raises NAD+, but slowing ageing is unproven.' } },

    { id: 'pqq', art: 'energy', key: 'mito', tier: 'support', when: 'morning', food: 'with', ev: 2,
      d: { v: '10–20', u: 'mg', per: 'daily' },
      topics: ['mito','energy','mind','sleep'],
      cs: { name: 'PQQ', blurb: 'Jediná látka zkoumaná pro tvorbu zcela nových mitochondrií, ne jen pro jejich opravu.', note: 'Studie jsou malé, ale konzistentní u únavy a spánku. Často se kombinuje s koenzymem Q10.' },
      en: { name: 'PQQ', blurb: 'The one compound studied for building brand-new mitochondria rather than just repairing them.', note: 'Studies are small but consistent for fatigue and sleep. Usually paired with CoQ10.' } },

    { id: 'ala', art: 'energy', key: 'mito', tier: 'support', when: 'morning', food: 'empty', ev: 2,
      d: { v: '300–600', u: 'mg', per: 'daily' },
      topics: ['mito','pcos','nerves','skin','energy'],
      cs: { name: 'Kyselina alfa-lipoová', blurb: 'Antioxidant, který pracuje uvnitř mitochondrií a umí recyklovat vitaminy C a E zpět do aktivní formy.', note: 'Snižuje glykémii — při cukrovce nebo hypoglykémiích opatrně. Nejlépe nalačno, s jídlem se vstřebá hůř.' },
      en: { name: 'Alpha-lipoic acid', blurb: 'An antioxidant that works inside mitochondria and recycles vitamins C and E back to active form.', note: 'It lowers blood sugar — take care with diabetes. Best fasted; food cuts absorption.' } },

    { id: 'glycine', art: 'herbsCalm', key: 'sleep', tier: 'support', when: 'evening', food: 'any', ev: 2,
      d: { v: '3', u: 'g', per: 'beforeBed' },
      topics: ['sleep','mind','skin','recovery','nerves'],
      cs: { name: 'Glycin', blurb: 'Aminokyselina, která před spaním mírně sníží tělesnou teplotu — a tím usnadní usínání. Zároveň je stavebním kamenem kolagenu.', note: 'Levný, sladký na chuť, dobře snášený. Kombinuje se s hořčíkem a theaninem jako večerní trojice.' },
      en: { name: 'Glycine', blurb: 'An amino acid that gently lowers body temperature before bed, which helps you drop off. Also a building block of collagen.', note: 'Cheap, sweet-tasting, well tolerated. Often stacked with magnesium and theanine at night.' } },

    { id: 'taurine', art: 'heart', key: 'mito', tier: 'support', when: 'any', food: 'any', ev: 2,
      d: { v: '1–3', u: 'g', per: 'daily' },
      topics: ['heart','mito','energy','recovery','nerves'],
      cs: { name: 'Taurin', blurb: 'Aminokyselina, která chrání mitochondrie a podílí se na regulaci vápníku v srdci. Hladina klesá s věkem.', note: 'U zvířat prodloužil život, u lidí zatím jen data na tlak a výkon. Bezpečný i ve vyšších dávkách.' },
      en: { name: 'Taurine', blurb: 'An amino acid that protects mitochondria and helps regulate calcium in the heart. Levels fall with age.', note: 'It extended life in animals; in humans we only have blood pressure and performance data. Safe at higher doses.' } },

    { id: 'berberine', art: 'herbsHormone', key: 'pcos', tier: 'herb', when: 'morning', food: 'with', ev: 2,
      d: { v: '500', u: 'mg 2–3×', per: 'daily' },
      topics: ['pcos','hormonal','gut','herbsHormone','heart'],
      cs: { name: 'Berberin', blurb: 'Rostlinný alkaloid s účinkem na krevní cukr, který se u PCOS srovnává s metforminem.', note: 'Není to bylinka na doplnění — působí jako lék. Silně ovlivňuje jaterní enzymy a jiné léky. V těhotenství nevhodný.' },
      en: { name: 'Berberine', blurb: 'A plant alkaloid that acts on blood sugar and gets compared with metformin in PCOS.', note: 'Not a gentle herb — it behaves like a drug, strongly affects liver enzymes and other medication. Not in pregnancy.' } },

    { id: 'ginger', art: 'herbsCalm', key: 'herbsCalm', tier: 'herb', when: 'any', food: 'with', ev: 2,
      d: { v: '750–2 000', u: 'mg', per: 'daily' },
      topics: ['cycle','pregnancy','gut','herbsCalm','endo'],
      cs: { name: 'Zázvor', blurb: 'Jedna z mála bylin, kde se tradiční použití a klinické studie opravdu potkávají — menstruační bolest a nevolnost.', note: 'Na menstruační bolest se studoval první 3–4 dny cyklu. V těhotenství na nevolnost obvykle v nižších dávkách.' },
      en: { name: 'Ginger', blurb: 'One of the few herbs where tradition and trials actually meet — period pain and nausea.', note: 'Studied for the first 3–4 days of the period. Lower doses are usual for pregnancy nausea.' } },

    { id: 'saffron', art: 'herbsCalm', key: 'herbsCalm', tier: 'herb', when: 'any', food: 'any', ev: 2,
      d: { v: '30', u: 'mg', per: 'daily' },
      topics: ['cycle','mind','stress','herbsCalm','hormonal'],
      cs: { name: 'Šafrán', blurb: 'Bylina s překvapivě slušnými daty na PMS a menstruační bolest — a zároveň jedna z nejdražších na světě.', note: 'Kvůli ceně se často falšuje. Kupujte standardizovaný extrakt od ověřeného výrobce.' },
      en: { name: 'Saffron', blurb: 'A herb with surprisingly decent data for PMS and period pain — and the priciest spice on earth.', note: 'Widely adulterated because of the price. Buy a standardised extract from a reputable source.' } },

    { id: 'nac', art: 'immunity', key: 'hormonal', tier: 'support', when: 'morning', food: 'empty', ev: 2,
      d: { v: '600–1 800', u: 'mg', per: 'daily' },
      topics: ['pcos','hormonal','mito','immunity','preconception','acne'],
      cs: { name: 'NAC', blurb: 'Prekurzor glutathionu, hlavního antioxidantu těla. Zkoumaný u PCOS pro metabolické i reprodukční ukazatele.', note: 'Není náhrada za metformin ani za léčbu. Výsledky studií se hodně liší.' },
      en: { name: 'NAC', blurb: 'A precursor to glutathione, the body\'s main antioxidant. Studied in PCOS for metabolic and reproductive markers.', note: 'Not a replacement for metformin or medical treatment. Study results vary widely.' } },

    { id: 'cranberry', art: 'immunity', key: 'immunity', tier: 'support', when: 'any', food: 'any', ev: 2,
      d: { v: '36', u: 'mg PAC', per: 'daily' },
      topics: ['immunity','gut','adult25','meno'],
      cs: { name: 'Brusinky', blurb: 'U žen s opakovanými záněty močových cest pravděpodobně snižují riziko dalšího zánětu.', note: 'Prevence není léčba. Na už probíhající zánět brusinky nefungují — ten patří k lékaři.' },
      en: { name: 'Cranberry', blurb: 'In women with recurrent UTIs it probably lowers the risk of the next one.', note: 'Prevention is not treatment. It does not clear an active infection — that needs a doctor.' } },

    { id: 'd-mannose', art: 'immunity', key: 'immunity', tier: 'support', when: 'any', food: 'any', ev: 1,
      d: { v: '2', u: 'g', per: 'daily' },
      topics: ['immunity','adult25'],
      cs: { name: 'D-manóza', blurb: 'Roky doporučovaná na prevenci zánětů močových cest. Velká studie z roku 2024 ale rozdíl proti placebu nenašla.', note: 'Uvádíme ji proto, že se pořád hodně prodává — ne proto, že bychom ji doporučovali.' },
      en: { name: 'D-mannose', blurb: 'Recommended for years to prevent UTIs. A large 2024 trial found no difference from placebo.', note: 'We list it because it still sells well — not because we recommend it.' } },

    { id: 'vitamin-a', art: 'skin', key: 'skin', tier: 'support', when: 'any', food: 'with', ev: 3,
      d: { v: '700', u: 'µg RAE', per: 'daily' },
      topics: ['skin','immunity','pregnancy','hair','acne'],
      cs: { name: 'Vitamin A', blurb: 'Nezbytný pro zrak, pleť a imunitu. V těhotenství ale platí opak pravidla „víc je líp".', note: 'Nadbytek retinolu v těhotenství poškozuje plod. Beta-karoten z jídla se posuzuje jinak než retinol z doplňků.' },
      en: { name: 'Vitamin A', blurb: 'Essential for vision, skin, and immunity. In pregnancy the "more is better" rule flips entirely.', note: 'Excess retinol harms the fetus. Beta-carotene from food is treated differently from retinol in supplements.' } },

    { id: 'electrolytes', art: 'hiit', key: 'hiit', tier: 'support', when: 'any', food: 'any', ev: 2,
      d: { v: '300–1 000', u: 'mg', per: 'perHour' },
      topics: ['hiit','strength','recovery','energy','cycle'],
      cs: { name: 'Elektrolyty', blurb: 'Sodík, draslík a hořčík, které odcházejí potem. Bez nich přijde slabost a křeče.', note: 'Potřeba roste v horku a při delším tréninku. S vysokým tlakem sodík opatrně.' },
      en: { name: 'Electrolytes', blurb: 'The sodium, potassium, and magnesium that leave in sweat. Without them come cramps.', note: 'Needs rise in heat and on long sessions. Go easy on sodium with high blood pressure.' } },

    { id: 'ashwagandha', art: 'adaptogens', key: 'adaptogens', tier: 'adapto', when: 'evening', food: 'with', ev: 2,
      d: { v: '300–600', u: 'mg', per: 'daily' },
