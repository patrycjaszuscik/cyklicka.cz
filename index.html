  /* what it actually does in the body, and why that matters for women */
  const WHAT = {
    'vitamin-d3': {
      cs: 'Není to vlastně vitamin, ale hormon — tělo si ho vyrábí z cholesterolu, když na kůži dopadne UVB záření. Bez něj vstřebáte jen 10–15 % vápníku z jídla místo 30–40 %. Receptory pro vitamin D má skoro každá buňka v těle, včetně vaječníků a imunitních buněk, což vysvětluje, proč se při nízké hladině hlásí únava, časté infekce i zhoršená nálada. Od října do března je v našich zeměpisných šířkách slunce příliš nízko na to, aby kůže cokoli vyrobila.',
      en: 'It is not really a vitamin but a hormone — your skin makes it from cholesterol when UVB hits it. Without it you absorb only 10–15% of dietary calcium instead of 30–40%. Almost every cell has vitamin D receptors, including ovaries and immune cells, which is why low levels show up as fatigue, frequent infections and low mood. From October to March the sun sits too low here for skin to make any.' },
    magnesium: {
      cs: 'Podílí se na více než 300 enzymatických reakcích — od tvorby energie po uvolnění svalu. Právě uvolnění je klíč: vápník sval stahuje, hořčík ho pouští. Proto se nedostatek projevuje křečemi, ztuhlou čelistí, bušením srdce i tím, že v noci nejde vypnout hlava. Estrogen ovlivňuje hladinu hořčíku v průběhu cyklu, takže před menstruací bývá nejníž — odtud chuť na čokoládu, která je jeho dobrým zdrojem.',
      en: 'It takes part in over 300 enzyme reactions, from making energy to relaxing muscle. Relaxation is the key part: calcium contracts a muscle, magnesium releases it. That is why shortage shows up as cramps, a clenched jaw, palpitations and a mind that will not switch off at night. Estrogen shifts magnesium across the cycle, so it dips lowest before your period — which is where the chocolate craving comes from.' },
    iron: {
      cs: 'Tvoří jádro hemoglobinu, který rozváží kyslík do každé buňky. Když ho ubývá, tělo šetří — nejdřív na energii, soustředění a teplotě rukou. Menstruující žena ztrácí každý cyklus 30–40 ml krve a s ní 15–30 mg železa; při silném krvácení i několikanásobek. Zásoby se měří ferritinem, ne hemoglobinem: hemoglobin klesá až jako poslední, kdy jsou sklady dávno prázdné. Proto můžete být vyčerpaná s „normálním krevním obrazem".',
      en: 'It forms the core of haemoglobin, which carries oxygen to every cell. As it drops, the body rations — first on energy, focus and warm hands. A menstruating woman loses 30–40 ml of blood each cycle and 15–30 mg of iron with it, several times that with heavy bleeding. Stores are measured by ferritin, not haemoglobin: haemoglobin falls last, when the warehouse is long empty. That is how you can be exhausted with "normal blood work".' },
    'omega-3': {
      cs: 'EPA a DHA se zabudovávají přímo do membrán buněk a mění jejich pružnost — nejvíc v mozku, sítnici a srdci. Z EPA tělo vyrábí signální látky, které zánět tlumí, zatímco z omega-6 ty, které ho spouštějí. Poměr v jídelníčku tak doslova ladí, jak moc je tělo zanícené. V těhotenství si plod bere DHA z maminčiných zásob bez ohledu na to, kolik jich má — proto se po porodu tak často objevuje mlha v hlavě.',
      en: 'EPA and DHA build directly into cell membranes and change their flexibility — most of all in brain, retina and heart. From EPA the body makes signals that damp inflammation down; from omega-6, signals that switch it on. The dietary ratio literally tunes how inflamed you run. In pregnancy the baby takes DHA from your stores regardless of how much you have, which is part of why postpartum brain fog is so common.' },
    b12: {
      cs: 'Potřebný pro tvorbu červených krvinek a pro myelin — izolační vrstvu kolem nervů. Bez něj nervový signál doslova protéká, což se hlásí brněním rukou a nohou, výpadky paměti nebo nejistou chůzí. Vstřebává se jen s vnitřním faktorem ze žaludku, kterého s věkem a při lécích na pálení žáhy ubývá. Rostliny ho neobsahují vůbec — to, co je v řasách a kvasnicích, je většinou neaktivní analog, který se tváří jako B12, ale nefunguje.',
      en: 'Needed to build red blood cells and myelin, the insulating sheath around nerves. Without it the nerve signal literally leaks, which shows as tingling hands and feet, memory gaps or an unsteady walk. It absorbs only with intrinsic factor from the stomach, which declines with age and with acid-reducing medication. Plants contain none — what sits in algae and yeast is mostly an inactive analogue that mimics B12 without working.' },
    protein: {
      cs: 'Dodává aminokyseliny, ze kterých tělo staví svaly, kolagen, enzymy, protilátky i hormony. Zásobárnu bílkovin nemáme — co nepřijde v jídle, vezme si tělo ze svalu. Po čtyřicítce klesá citlivost svalu na aminokyseliny, takže stejná porce spustí menší stavbu než ve dvaceti; proto potřeba stoupá, ne klesá. Svalová hmota navíc funguje jako metabolický orgán a hlavní sklad glukózy — čím víc svalu, tím stabilnější cukr a hormonální rovnováha.',
      en: 'It supplies the amino acids your body builds muscle, collagen, enzymes, antibodies and hormones from. There is no protein store — whatever food does not supply, the body takes from muscle. After 40 muscle becomes less sensitive to amino acids, so the same portion triggers less building than at 20; the requirement rises rather than falls. Muscle also acts as a metabolic organ and your main glucose store, so more of it means steadier blood sugar and hormones.' },
    folate: {
      cs: 'Řídí dělení buněk a kopírování DNA — proto ho potřebuje každá rychle rostoucí tkáň. Neurální trubice, ze které vznikne mozek a mícha, se uzavírá mezi 21. a 28. dnem těhotenství, tedy ve chvíli, kdy většina žen o těhotenství ještě neví. Právě proto se doporučuje užívat ho už před početím, ne až po pozitivním testu.',
      en: 'It runs cell division and DNA copying, so every fast-growing tissue needs it. The neural tube that becomes brain and spinal cord closes between days 21 and 28 of pregnancy — before most women know they are pregnant. That is exactly why it is advised before conception rather than after a positive test.' },
    creatine: {
      cs: 'Funguje jako rychlá baterie: drží ve svalu fosfát, který během vteřin obnoví ATP při maximálním úsilí. Ženy mají přirozeně o 70–80 % nižší zásoby než muži a z jídla jich doplní míň, protože jedí méně masa — proto na doplnění reagují často výrazněji. Kreatin využívá i mozek, a zájem o něj v přechodu roste právě kvůli mozkové mlze a nevyspání.',
      en: 'It works like a fast battery: it holds a phosphate in muscle that regenerates ATP within seconds of maximum effort. Women have naturally 70–80% smaller stores than men and top up less from food because they eat less meat — which is why they often respond more noticeably. The brain uses creatine too, which is why interest has grown around menopausal brain fog and poor sleep.' },
    calcium: {
      cs: 'Pouhé 1 % vápníku v těle koluje v krvi a řídí stahy svalů, srážení krve a přenos nervových vzruchů — a tuhle hladinu tělo brání za každou cenu. Když ho v jídle není dost, vezme si ho z kostí, které fungují jako banka. Kosti se budují do zhruba třiceti let, pak se už jen udržují. Po menopauze estrogen přestane brzdit buňky, které kost rozebírají, a odbourávání začne převažovat nad stavbou.',
      en: 'Just 1% of your calcium circulates in blood, running muscle contraction, clotting and nerve signals — and the body defends that level at any cost. When food falls short it withdraws from bone, which works as the bank. Bone is built until about 30, then only maintained. After menopause estrogen stops restraining the cells that break bone down, and demolition starts outpacing construction.' },
    'vitamin-c': {
      cs: 'Bez něj nelze vyrobit kolagen — je kofaktorem enzymu, který mu dává pevnost. Proto se u námořníků s kurdějemi rozpadaly dásně a rány se přestaly hojit. Zároveň mění železo z rostlin do formy, kterou střevo umí přijmout, a to až několikanásobně. Je ve vodě rozpustný a tělo si ho neukládá, takže rozhoduje pravidelnost, ne velikost dávky.',
      en: 'Collagen cannot be made without it — it is the cofactor for the enzyme that gives collagen its strength. That is why sailors with scurvy lost their gums and stopped healing. It also converts plant iron into the form the gut can take up, often several times over. It is water-soluble and not stored, so regularity beats dose size.' },
    zinc: {
      cs: 'Je součástí více než 300 enzymů a takzvaných zinkových prstů — bílkovin, které se navazují na DNA a rozhodují, které geny se přečtou. Proto ho nejvíc potřebují tkáně, které se rychle obnovují: kůže, sliznice, imunitní buňky a vajíčka. V pleti tlumí mazové žlázy a působí protizánětlivě, což je důvod, proč se objevuje v léčbě akné. Podílí se i na uvolnění vajíčka při ovulaci a na dozrávání folikulu.',
      en: 'It sits in over 300 enzymes and in zinc fingers — proteins that bind DNA and decide which genes get read. So the tissues that renew fastest need it most: skin, mucous membranes, immune cells and eggs. In skin it calms sebaceous glands and acts anti-inflammatory, which is why it appears in acne treatment. It also takes part in releasing the egg at ovulation and in follicle maturation.' },
    b6: {
      cs: 'V aktivní formě P5P je kofaktorem při výrobě serotoninu, dopaminu a GABA — tří látek, které řídí náladu, chuť k jídlu a schopnost se zklidnit. Podílí se i na odbourávání estrogenu v játrech, což je nejčastěji uváděný důvod, proč se zkoumá u PMS. Zároveň pomáhá tvořit hem, takže spolupracuje se železem.',
      en: 'In its active P5P form it is the cofactor for making serotonin, dopamine and GABA — the three that run mood, appetite and the ability to settle. It also takes part in clearing estrogen in the liver, the most commonly cited reason it is studied in PMS. It helps build haem too, so it works alongside iron.' },
    iodine: {
      cs: 'Je fyzickou součástí hormonů štítné žlázy — atomy jódu se do nich doslova zabudují, a podle jejich počtu vzniká T3 nebo T4. Tyhle hormony určují rychlost metabolismu každé buňky, tedy i to, jak je vám teplo, jak rychle myslíte a jak vypadají vlasy. V těhotenství potřeba stoupá skoro o polovinu, protože plod si vlastní štítnou žlázu vytvoří až kolem 12. týdne a do té doby žije z maminčiných hormonů.',
      en: 'It is physically part of thyroid hormone — iodine atoms build into the molecule, and their number makes it T3 or T4. Those hormones set the metabolic speed of every cell, including how warm you feel, how quickly you think and how your hair behaves. In pregnancy the need rises by nearly half, because the baby only forms its own thyroid around week 12 and lives on yours until then.' },
    choline: {
      cs: 'Je stavebním kamenem acetylcholinu, přenašeče pro paměť a pozornost, a fosfatidylcholinu, ze kterého jsou membrány všech buněk. V těhotenství se z něj staví hipokampus — oblast mozku pro paměť. Tělo si ho umí vyrobit jen málo a schopnost tvorby zvyšuje estrogen, takže po menopauze potřeba z jídla stoupá.',
      en: 'It is the building block of acetylcholine, the messenger for memory and attention, and of phosphatidylcholine, which forms every cell membrane. In pregnancy it builds the hippocampus, the brain\'s memory region. The body makes only a little, and estrogen raises that capacity — so the dietary need rises after menopause.' },
    k2: {
      cs: 'Aktivuje dvě bílkoviny: osteokalcin, který vápník ukotví v kosti, a MGP, který ho naopak drží mimo stěny cév. Bez K2 se vápník vstřebá, ale nikdo mu neřekne, kam má jít. Právě proto se dnes doporučuje k vitaminu D a vápníku — samotné zvyšování vápníku bez K2 posouvá riziko z kostí do tepen.',
      en: 'It activates two proteins: osteocalcin, which anchors calcium into bone, and MGP, which keeps it out of artery walls. Without K2 calcium is absorbed but nobody tells it where to go. That is why it is now paired with vitamin D and calcium — raising calcium without K2 shifts the risk from bones to arteries.' },
    collagen: {
      cs: 'Tvoří asi 30 % všech bílkovin v těle a drží pohromadě kůži, šlachy, chrupavku i kosti. Hydrolyzované peptidy se ve střevě rozloží na aminokyseliny a krátké fragmenty; právě ty fragmenty podle studií signalizují buňkám kůže, aby zvýšily vlastní produkci. Ženy ztrácejí až 30 % kožního kolagenu v prvních pěti letech po menopauze, protože jeho tvorbu řídil estrogen.',
      en: 'It makes up about 30% of all body protein and holds together skin, tendons, cartilage and bone. Hydrolysed peptides break down in the gut into amino acids and short fragments; studies suggest those fragments signal skin cells to raise their own production. Women lose up to 30% of skin collagen in the first five years after menopause, because estrogen was driving its production.' },
    probiotics: {
      cs: 'Bakterie ve střevě vyrábějí mastné kyseliny, které živí buňky střevní stěny, a podílejí se na tvorbě serotoninu — asi 90 % ho vzniká právě tady. Ve střevě také sídlí enzym beta-glukuronidáza, který umí „recyklovat" estrogen zpět do oběhu; tomuhle souboru bakterií se říká estrobolom a je jedním z mostů mezi trávením a hormony. Poševní mikrobiom je oddělený ekosystém, kde vládnou laktobacily udržující kyselé pH.',
      en: 'Gut bacteria make fatty acids that feed the cells of the gut wall, and take part in producing serotonin — about 90% of it is made there. The gut also hosts beta-glucuronidase, an enzyme that can recycle estrogen back into circulation; that set of bacteria is called the estrobolome and is one bridge between digestion and hormones. The vaginal microbiome is a separate ecosystem run by lactobacilli that keep pH acidic.' },
    coq10: {
      cs: 'Sedí uvnitř mitochondrií a přenáší elektrony v posledním kroku výroby energie — bez něj se ATP prostě nevyrobí. Nejvíc ho mají orgány s nejvyšší spotřebou energie: srdce, játra a vajíčka. Vajíčko je energeticky nejnáročnější buňka v těle a jeho mitochondrie stárnou spolu s námi, což je důvod, proč se CoQ10 zkoumá u snížené ovariální rezervy. Statiny jeho tvorbu blokují jako vedlejší efekt.',
      en: 'It sits inside mitochondria and carries electrons in the final step of making energy — without it no ATP gets made. The organs with the highest energy demand hold the most: heart, liver and eggs. An egg is the most energy-hungry cell in the body and its mitochondria age with you, which is why CoQ10 is studied in diminished ovarian reserve. Statins block its production as a side effect.' },
    selenium: {
      cs: 'Štítná žláza má nejvyšší koncentraci selenu ze všech orgánů. Potřebuje ho enzym, který mění zásobní T4 na aktivní T3, a druhý, který žlázu chrání před peroxidem vodíku vznikajícím při tvorbě hormonů. Proto se při autoimunitním zánětu sleduje právě selen. Rozdíl mezi potřebnou a toxickou dávkou je ale menší než u většiny minerálů.',
      en: 'The thyroid holds the highest selenium concentration of any organ. It is needed by the enzyme that converts storage T4 into active T3, and by another that shields the gland from the hydrogen peroxide made during hormone production. That is why selenium is watched in autoimmune thyroiditis. The gap between the needed and the toxic dose is narrower than for most minerals.' },
    inositol: {
      cs: 'Chová se jako druhý posel — látka, která uvnitř buňky předá zprávu poté, co se inzulin naváže na její povrch. U PCOS bývá tenhle přenos porušený, takže vaječník dostává signál „je tu hodně inzulinu" a odpovídá tvorbou androgenů. Doplnění inositolu má přenos zlepšit, a tím snížit androgeny a obnovit ovulaci. Myo-forma převažuje ve vaječníku, D-chiro v játrech a svalech.',
      en: 'It acts as a second messenger — the molecule that carries the message inside the cell once insulin binds outside. In PCOS that relay is often faulty, so the ovary hears "lots of insulin" and answers by making androgens. Supplementing is meant to improve the relay, lowering androgens and restoring ovulation. The myo form dominates in the ovary, D-chiro in liver and muscle.' },
    'l-theanine': {
      cs: 'Zvyšuje aktivitu alfa vln v mozku — stejný stav, jaký přichází při meditaci nebo těsně před usnutím. Mírně zvedá GABA a dopamin, ale nevyvolává útlum, takže zklidní, aniž by zpomalila myšlení. S kofeinem se doplňují: kofein přidá bdělost, theanin odebere nervozitu a bušení srdce.',
      en: 'It raises alpha wave activity in the brain — the same state that arrives in meditation or just before sleep. It nudges GABA and dopamine up without sedating, so it calms without slowing your thinking. With caffeine the two complement each other: caffeine adds alertness, theanine removes the jitter and racing heart.' },
    melatonin: {
      cs: 'Není to uspávadlo, ale časový signál — šišinka ho vyplaví, jakmile ubude modré světlo, a tělo podle něj pozná, že je noc. Po padesátce ho vyrábíme podstatně méně, a k tomu přispívá i to, že návaly a noční pocení spánek přerušují. Mikrodávka 0,3 mg odpovídá přirozené hladině lépe než běžné 5mg tablety; vyšší dávky posouvají vnitřní hodiny víc, než je potřeba.',
      en: 'It is not a sedative but a timing signal — the pineal gland releases it once blue light fades, and the body reads it as night. Production drops substantially after 50, and flashes and night sweats fragment sleep on top of that. A 0.3 mg microdose matches natural levels better than the usual 5 mg tablets; higher doses shift the body clock further than intended.' },
    electrolytes: {
      cs: 'Sodík, draslík a hořčík nesou elektrický náboj a bez nich neproběhne jediný nervový vzruch ani stah svalu. Potem odchází hlavně sodík — u některých žen 200 mg na litr, u jiných přes 1 500 mg. Pití samotné vody při velkých ztrátách zředí sodík v krvi, což se projeví slabostí a bolestí hlavy dřív než žízní. Potřeba stoupá také ve druhé polovině cyklu, kdy progesteron mírně zvyšuje ztráty sodíku.',
      en: 'Sodium, potassium and magnesium carry electrical charge; without them no nerve fires and no muscle contracts. Sweat takes mainly sodium — 200 mg per litre in some women, over 1,500 mg in others. Drinking plain water through big losses dilutes blood sodium, which shows as weakness and headache before thirst. The need also rises in the second half of the cycle, when progesterone slightly increases sodium loss.' },
    'vitamin-a': {
      cs: 'Řídí, jak se buňky specializují — proto se retinoidy používají na akné i na stárnutí pleti. Je nezbytný pro rodopsin, pigment sítnice, který umožňuje vidět za šera, a pro zdravé sliznice dýchacích cest. Stejná schopnost řídit vývoj buněk ale znamená, že nadbytek v těhotenství naruší vývoj plodu. Beta-karoten z rostlin je bezpečný, protože si ho tělo přeměňuje jen podle potřeby.',
      en: 'It directs how cells specialise, which is why retinoids are used for acne and for skin ageing. It is essential for rhodopsin, the retinal pigment behind dim-light vision, and for healthy airway linings. That same power over cell development means excess in pregnancy disrupts fetal development. Beta-carotene from plants is safe because the body converts only what it needs.' },
    nac: {
      cs: 'Dodává cystein, aminokyselinu, která v těle nejvíc chybí při výrobě glutathionu — hlavního antioxidantu, s nímž játra odbourávají cizorodé látky a hormony. V nemocnici se NAC používá jako protijed při otravě paracetamolem právě proto, že glutathion doplňuje během hodin. U PCOS se zkoumá kvůli oxidačnímu stresu ve folikulu a kvůli citlivosti na inzulin.',
      en: 'It supplies cysteine, the amino acid most often limiting the production of glutathione — the master antioxidant the liver uses to clear foreign compounds and hormones. Hospitals use NAC as the antidote in paracetamol poisoning precisely because it restores glutathione within hours. In PCOS it is studied for oxidative stress inside the follicle and for insulin sensitivity.' },
    glycine: {
      cs: 'Nejmenší aminokyselina, která zároveň funguje jako tlumivý neuropřenašeč v mozkovém kmeni. Před spaním rozšíří cévy v dlaních a chodidlech, tělo tím odvede teplo a jádrová teplota klesne — a právě pokles teploty je signál, po kterém přichází spánek. Zároveň tvoří třetinu kolagenu, takže spojuje spánek a pleť do jedné molekuly.',
      en: 'The smallest amino acid, which also acts as an inhibitory neurotransmitter in the brainstem. Before bed it widens blood vessels in palms and feet so the body sheds heat and core temperature falls — and that fall is the signal sleep follows. It also makes up a third of collagen, tying sleep and skin to a single molecule.' },
    taurine: {
      cs: 'Stabilizuje membrány buněk a reguluje, kolik vápníku se dostane dovnitř — což je zásadní hlavně v srdci a nervech. Podílí se i na tvorbě žlučových kyselin, takže pomáhá trávit tuky a vstřebávat vitaminy A, D, E a K. Hladina v těle klesá s věkem zhruba na třetinu a právě to vzbudilo zájem výzkumu stárnutí.',
      en: 'It stabilises cell membranes and regulates how much calcium enters — critical in heart and nerve tissue. It also helps make bile acids, so it aids fat digestion and the uptake of vitamins A, D, E and K. Body levels fall to roughly a third with age, which is what drew ageing research to it.' },
    ala: {
      cs: 'Jediný antioxidant, který je rozpustný ve vodě i v tuku, takže funguje uvnitř buňky i v její membráně. Navíc umí „dobít" už spotřebované vitaminy C a E zpátky do aktivní formy. V mitochondriích slouží jako kofaktor enzymů, které mění cukr na energii — proto se zkoumá u inzulinové rezistence a nervových potíží u diabetu.',
      en: 'The one antioxidant soluble in both water and fat, so it works inside the cell and within its membrane. It can also recharge spent vitamins C and E back into active form. Inside mitochondria it is a cofactor for the enzymes converting sugar into energy, which is why it is studied in insulin resistance and diabetic nerve problems.' },
    pqq: {
      cs: 'Zatímco většina látek mitochondrie chrání nebo pohání, PQQ jako jediná spouští jejich množení — aktivuje signální dráhu PGC-1α, která dá buňce pokyn postavit nové mitochondrie. Víc mitochondrií znamená vyšší kapacitu vyrábět energii, což je zajímavé hlavně tam, kde jí ubývá: v mozku, srdci a svalech.',
      en: 'Where most compounds protect or fuel mitochondria, PQQ is the one that triggers making more — it activates the PGC-1α pathway that tells a cell to build new ones. More mitochondria means more capacity to produce energy, which matters most where that capacity is fading: brain, heart and muscle.' },
    nad: {
      cs: 'NAD+ je koenzym, bez kterého neproběhne přenos energie ze živin na ATP — a zároveň palivo pro sirtuiny, bílkoviny opravující DNA. Jeho hladina klesá zhruba o polovinu mezi dvacítkou a padesátkou. NMN i NR jsou meziprodukty, ze kterých si ho buňka poskládá. Že hladina v krvi po doplnění stoupne, je jisté; co z toho tělo získá, zatím ne.',
      en: 'NAD+ is the coenzyme without which energy cannot pass from nutrients to ATP — and the fuel for sirtuins, the proteins that repair DNA. Levels fall by roughly half between 20 and 50. NMN and NR are intermediates the cell reassembles into it. That blood levels rise after supplementing is certain; what the body gains from that is not.' },
    berberine: {
      cs: 'Aktivuje AMPK, buněčný „spínač hladu", který tělo normálně zapne při cvičení nebo půstu — a ten zvýší příjem glukózy do buněk bez inzulinu. Mění také složení střevních bakterií, což je druhý mechanismus, jak snižuje cukr. Vstřebává se špatně, a právě proto působí silně ve střevě a hodně ovlivňuje jaterní enzym CYP3A4, přes který se odbourává řada léků.',
      en: 'It activates AMPK, the cellular hunger switch the body normally flips during exercise or fasting, which raises glucose uptake into cells without insulin. It also reshapes gut bacteria, a second route by which it lowers sugar. It absorbs poorly, which is exactly why it acts strongly in the gut and heavily affects the liver enzyme CYP3A4 that clears many medicines.' },
    biotin: {
      cs: 'Je kofaktorem enzymů, které skládají mastné kyseliny — a právě z nich jsou keratinové buňky vlasu a nehtu. Skutečný nedostatek je u zdravé ženy vzácný, protože ho vyrábějí i střevní bakterie. Objevuje se spíš v těhotenství, při dlouhodobých antibiotikách nebo při konzumaci syrových bílků, které biotin váží. Mega dávky v „hair" produktech jsou stonásobky potřeby a zkreslují krevní testy.',
      en: 'It is the cofactor for enzymes that assemble fatty acids — the very material of keratin cells in hair and nail. True deficiency is rare in a healthy woman because gut bacteria make some. It appears more in pregnancy, on long antibiotic courses, or with raw egg whites, which bind biotin. The mega doses in hair products are a hundredfold the requirement and skew blood tests.' },
    cranberry: {
      cs: 'Nejde o okyselení moči, jak se dlouho tradovalo. Proanthokyanidiny typu A obalí bakterie E. coli tak, že se nedokážou přichytit na stěnu močového měchýře, a odejdou močí dřív, než stihnou vyvolat zánět. Proto funguje jako prevence, ale na už probíhající infekci nemá co zabrat — bakterie jsou tou dobou přichycené a namnožené.',
      en: 'It is not about acidifying urine, as was long believed. Type-A proanthocyanidins coat E. coli so they cannot grip the bladder wall, and they leave in urine before an infection takes hold. That is why it works as prevention but has nothing to act on in an active infection, when bacteria are already attached and multiplying.' }
  };

  const whatText = (item) => (WHAT[item.id] ? WHAT[item.id][lang] : item[lang].blurb);

  /* split prose into separate points — Czech ordinals like "21. dnem" must stay intact */
  function sentences(text) {
    const out = [];
    let buf = '';
    for (let i = 0; i < text.length; i++) {
      buf += text[i];
      if (text[i] === '.' || text[i] === '!' || text[i] === '?') {
        const before = text[i - 1] || '';
        const after = text[i + 1] || '';
        const next = text[i + 2] || '';
        const digitBefore = before >= '0' && before <= '9';
        const breaks = after === ' ' && next === next.toUpperCase() && next !== next.toLowerCase();
        if (breaks && !digitBefore) { out.push(buf.trim()); buf = ''; i++; }
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  function whatList(item) {
    const parts = sentences(whatText(item));
    if (parts.length < 2) return '<p class="body">' + whatText(item) + '</p>';
    return '<div class="what-list">' + parts.map(function (s) {
      return '<div class="what-point"><span class="wp-dot"></span><p>' + s + '</p></div>';
    }).join('') + '</div>';
  }

  /* phase boundaries scale with cycle length — the luteal phase stays ~14 days, the follicular stretches */
  function phaseDays(len) {
    const ovEnd = len - 12;
    return {
      menstruation: [1, 5],
      follicular: [6, Math.max(7, ovEnd - 3)],
      ovulation: [Math.max(8, ovEnd - 2), ovEnd],
      luteal: [ovEnd + 1, len]
    };
  }

  function phaseFor(day, len) {
    const b = phaseDays(len);
    for (let i = 0; i < CYCLE.length; i++) {
      const r = b[CYCLE[i].id];
      if (day >= r[0] && day <= r[1]) return CYCLE[i];
    }
    return CYCLE[CYCLE.length - 1];
  }

  function cycleRing(selected, px, len) {
    const n = len || (typeof state !== 'undefined' && state.cycleLen) || 28;
    const r = 40, c = 50, out = [];
    out.push('<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="0.5"/>');
    for (let d = 1; d <= n; d++) {
      const phase = phaseFor(d, n);
      const a = (d - 1) / n * Math.PI * 2 - Math.PI / 2;
      const dim = selected && phase.id !== selected;
      const x = (c + Math.cos(a) * r).toFixed(2), y = (c + Math.sin(a) * r).toFixed(2);
      const label = t().cycleDay + ' ' + d + ' — ' + phase[lang].name;
      out.push('<g class="ring-day' + (dim ? ' dim' : '') + '" data-phase="' + phase.id +
        '" data-day="' + d + '" tabindex="0" role="button" aria-label="' + label + '">');
      out.push('<title>' + label + '</title>');
      if (!dim) out.push('<circle cx="' + x + '" cy="' + y + '" r="4.8" fill="' + phase.color + '" opacity=".2"/>');
      out.push('<circle class="rd-dot" cx="' + x + '" cy="' + y + '" r="' + (dim ? 1.4 : 2.4) + '" fill="' +
        phase.color + '" opacity="' + (dim ? '.28' : '1') + '"/>');
      out.push('<circle class="rd-hit" cx="' + x + '" cy="' + y + '" r="6.4" fill="transparent"/>');
      out.push('</g>');
    }
    return '<svg class="ring" viewBox="0 0 100 100" role="group" style="width:' + (px || 260) + 'px">' + out.join('') + '</svg>';
  }

      if (block) container.appendChild(block);
    });

    const picked = q.type === 'many' ? (Array.isArray(answer) ? answer.length : 0) : (answer ? 1 : 0);

          (state.step === QUESTIONS.length - 1 ? t().seePlan : t().next) + svg('arrow') + '</button>' +
      '</div>';

    const backBtn = el.quiz.querySelector('#q-back');
    if (backBtn) backBtn.addEventListener('click', () => {
      if (state.step > 0) { state.step--; renderQuiz(); }
      else goBack();
    });

    const opts = el.quiz.querySelector('#opts');
    q.options.forEach((opt, idx) => {
      const chosen = q.type === 'many' ? (Array.isArray(answer) && answer.includes(opt.id)) : answer === opt.id;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      b.style.setProperty('--oc', opt.c);
      b.setAttribute('aria-pressed', String(!!chosen));
      b.innerHTML = '<span class="option-check">' + svg('check') + '</span>' +
        '<span class="option-glyph">' + dot(opt.c) + '</span><span class="option-name">' + opt[lang] + '</span>' +
        '<span class="option-key">' + (idx + 1) + '</span>';
      b.addEventListener('click', () => {
        if (q.type === 'many') {
          const cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id].slice() : [];
          const at = cur.indexOf(opt.id);
          if (at > -1) cur.splice(at, 1); else if (cur.length < (q.max || 3)) cur.push(opt.id);
          state.answers[q.id] = cur;
          renderQuiz();
        } else {
          state.answers[q.id] = opt.id;
          if (state.step < QUESTIONS.length - 1) { state.step++; renderQuiz(); } else go({ view: 'plan' });
        }
      });
      opts.appendChild(b);
    });

    el.quiz.querySelector('#q-skip').addEventListener('click', () => {
      delete state.answers[q.id];
      if (state.step < QUESTIONS.length - 1) { state.step++; renderQuiz(); } else go({ view: 'plan' });
    });
    el.quiz.querySelector('#q-next').addEventListener('click', () => {
      if (state.step < QUESTIONS.length - 1) { state.step++; renderQuiz(); } else go({ view: 'plan' });
    });
  }

  function chosenOptions() {
    const out = [];
    QUESTIONS.forEach(q => {
      const a = state.answers[q.id];
      if (!a) return;
      (Array.isArray(a) ? a : [a]).forEach(id => {
        const opt = q.options.find(o => o.id === id);
        if (opt) out.push(opt);
      });
    });
    return out;
  }

  function scoreItems() {
    const picks = chosenOptions();
    return ITEMS.map(item => {
      let score = 0;
      const reasons = [];
      picks.forEach(opt => {
        const hit = (opt.topics || []).filter(tp => item.topics.includes(tp)).length;
        const boost = (opt.boost || {})[item.id] || 0;
        if (hit || boost) { score += hit * 2 + boost; reasons.push(opt[lang]); }
      });
      if (item.tier === 'core') score += 1.5;
      if (item.tier === 'herb') score -= 1;
      return { item: item, score: score, reasons: reasons };
    }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
  }

  /* diacritic-insensitive search across both languages */
  const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const terms = (q) => norm(q).split(/[^a-z0-9]+/).filter(function (x) { return x.length > 0; });
  /* a token matches only at the start of a word, so "d3" will not match "dávka" */
  const hits = function (hay, q) {
    const w = terms(q);
    if (!w.length) return false;
    const words = hay.split(/[^a-z0-9]+/);
    return w.every(function (x) {
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        /* a single letter must be a whole word, so "vit d" does not reach "drmek" */
        if (x.length === 1) { if (w === x) return true; continue; }
        if (w.indexOf(x) === 0) return true;
        /* the plural or a case ending: "vitaminy" over "vitamin" */
        if (x.length >= 4 && w.length >= 4 && x.indexOf(w) === 0) return true;
      }
      return false;
    });
  };

    probiotics: 'strevo nadymani traveni imunita mikrobiom prujem antibiotika kvasinky kandida',
    coq10: 'energie srdce statiny mitochondrie plodnost vajicka ubichinol ubichinon unava',
    selenium: 'stitna zlaza hashimoto imunita antioxidant protilatky',
    inositol: 'pcos inzulin cyklus ovulace plodnost akne ochlupeni cukr',
    'l-theanine': 'klid uzkost stres soustredeni caj nervozita trema',
    melatonin: 'spanek nespavost jetlag usinani buzeni v noci smena',
    nad: 'energie mitochondrie starnuti nmn nr nikotinamid ribosid unava bunecna energie',
    pqq: 'mitochondrie energie mozek spanek pyrrolochinolin unava',
    ala: 'cukr nervy antioxidant neuropatie kyselina alfa lipoova inzulin brneni',
    glycine: 'spanek kolagen jatra klid aminokyselina telesna teplota',
    taurine: 'srdce energie oci nervy tlak vytrvalost',
    berberine: 'cukr pcos inzulin cholesterol glykemie metformin',
    ginger: 'nevolnost krece traveni zanet zazvor tehotenska nevolnost bolestiva menstruace',
    saffron: 'nalada pms chut deprese safran uzkost',
    nac: 'jatra pcos plodnost hlen antioxidant acetylcystein glutation dychaci cesty',
    cranberry: 'mocove cesty uti brusinky zanet mechyre pale nis',
    'd-mannose': 'mocove cesty uti mechyr opakovane zanety',
    'vitamin-a': 'pokozka akne oci imunita retinol sero vidění',
    electrolytes: 'krece pot horko trenink sodik draslik dehydratace hypotonie',
    reishi: 'spanek stres imunita lingzhi klid jatra houba adaptogen',
    'lions-mane': 'pamet nervy soustredeni koralovec mozek ngf houba mlha v hlave',
    cordyceps: 'vydrz energie kyslik plice sport houba vytrvalost',
    tremella: 'pokozka hydratace vrasky vlasy houba stribrne ucho sucha plet',
    chaga: 'imunita antioxidant zanet briza houba',
    'turkey-tail': 'imunita strevo rekonvalescence outkovka houba psk',
    shiitake: 'imunita cholesterol strevo houba',
    maitake: 'imunita cukr hormony pcos houba',
    poria: 'spanek otoky traveni fuling houba neklid',
    ashwagandha: 'stres spanek kortizol uzkost vyhoreni napeti ksm66',
    rhodiola: 'vyhoreni unava soustredeni vykon rozchodnice vycerpani',
    maca: 'libido nalada energie hormony chut na sex',
    vitex: 'pms cyklus drmek prolaktin nepravidelny cyklus kratka luteani faze',
    'black-cohosh': 'navaly menopauza plosticnik nocni poceni prechod',
    sage: 'poceni navaly salvej nocni poceni prechod',
    epo: 'prsa pms pupalka citliva prsa bolestiva prsa',
    'red-clover': 'navaly menopauza jetel izoflavony prechod',
    shatavari: 'hormony laktace kojeni suchost menopauza plodnost',
    amalaki: 'plet imunita antioxidant vitamin c vlasy',
    eleuthero: 'vydrz regenerace imunita sport unava',
    ginseng: 'energie soustredeni imunita vycerpani libido',
    tulsi: 'stres uzkost spanek klid napeti',
    licorice: 'zaludek vyceprani sliznice pálení žáhy nadledviny',
    schisandra: 'jatra pozornost plet vykon',
    shilajit: 'unava mitochondrie mineraly energie',
    'he-shou-wu': 'vlasy sediny dlouhovekost krev',
    guduchi: 'imunita jatra zanety',
    astragalus: 'imunita srdce energie nachlazeni',
    mucuna: 'nalada motivace dopamin chut do zivota',
    jiaogulan: 'obeh metabolismus vykon cukr'
  };
  Object.keys(SEARCH_WORDS).forEach(function (k) {
    ALIAS[k] = (ALIAS[k] ? ALIAS[k] + ' ' : '') + SEARCH_WORDS[k];
  });

  const GROUPS = {
    'vitamin vitaminy vitamins': ['vitamin-d3', 'vitamin-c', 'vitamin-a', 'b12', 'b6', 'folate', 'k2', 'biotin'],
    'mineral mineraly minerals stopovy prvek': ['magnesium', 'iron', 'calcium', 'zinc', 'iodine', 'selenium', 'electrolytes'],
    'bylina byliny bylinky rostlina herb herbs': ['ginger', 'saffron', 'vitex', 'black-cohosh', 'sage', 'epo',
      'red-clover', 'berberine', 'licorice', 'tulsi', 'shatavari', 'amalaki', 'guduchi', 'astragalus',
      'he-shou-wu', 'schisandra', 'eleuthero', 'ginseng', 'rhodiola', 'maca', 'ashwagandha', 'jiaogulan', 'mucuna'],
    'houba houby medicinalni mushroom mushrooms': ['reishi', 'lions-mane', 'cordyceps', 'tremella', 'chaga',
      'turkey-tail', 'shiitake', 'maitake', 'poria'],
    'aminokyselina aminokyseliny bilkoviny amino acid': ['protein', 'creatine', 'glycine', 'taurine', 'nac', 'collagen'],
    'tuk tuky mastne kyseliny fat omega': ['omega-3'],
    'mitochondrie bunecna energie cell': ['nad', 'pqq', 'coq10', 'ala', 'shilajit']
  };
  Object.keys(GROUPS).forEach(function (words) {
    GROUPS[words].forEach(function (id) { ALIAS[id] = (ALIAS[id] ? ALIAS[id] + ' ' : '') + words; });
  });
  ITEMS.forEach(function (it) {
    ALIAS[it.id] = (ALIAS[it.id] ? ALIAS[it.id] + ' ' : '') + 'doplnek doplnky suplement supplement';
  });

  function haystack(item) {
    return norm([
      item.cs.name, item.en.name, item.cs.blurb, item.en.blurb, item.cs.note,
      ALIAS[item.id] || '',
      item.topics.map(x => TOPIC_MAP[x].cs.name + ' ' + TOPIC_MAP[x].en.name).join(' ')
    ].join(' '));
  }

  /* the name and the search words we keep for it are a direct hit; a topic
     it belongs to is weaker; a passing mention in the description weakest */
  function relevance(item, q) {
    if (!q) return 0;
    const keys = HELPS[item.id] ? HELPS[item.id].cs.join(' ') + ' ' + HELPS[item.id].en.join(' ') : '';
    if (hits(norm(item.cs.name + ' ' + item.en.name + ' ' + (ALIAS[item.id] || '') + ' ' + keys), q)) return 3;
    if (hits(norm(item.topics.map(x => TOPIC_MAP[x].cs.name + ' ' + TOPIC_MAP[x].en.name).join(' ')), q)) return 2;
    return 1;
  }

  /* direct hits and topic hits are both worth showing, strongest first; a word
     that merely appears in a description only counts when nothing better matched */
  function byRelevance(list, q) {
    if (!q) return list;
    const scored = list.map(function (i) { return { i: i, s: relevance(i, q) }; });
    const solid = scored.filter(function (x) { return x.s >= 2; });
    const keep = solid.length ? solid : scored;
    keep.sort(function (a, b) { return b.s - a.s; });
    return keep.map(function (x) { return x.i; });
  }

  function topicHits(q) {
    if (!q) return [];
    return TOPICS.filter(function (t) {
      return hits(norm(t.cs.name + ' ' + t.en.name + ' ' + (t.cs.sub || '') + ' ' + (t.en.sub || '')), q);
    }).slice(0, 6);
  }

  function matches(item) {
    if (state.savedOnly && !saved.has(item.id)) return false;
    if (state.query) {
      if (!hits(haystack(item), state.query)) return false;
    }
    if (state.topic) return item.topics.includes(state.topic);
    if (state.world && state.world !== 'cycle') return item.topics.some(x => TOPIC_MAP[x].world === state.world);
    return true;
  }

  function renderResults() {
    let color = 'var(--accent)', title = '', sub = '';
    if (state.savedOnly) { title = t().savedTitle; sub = t().savedSub; }
    else if (state.query) { title = t().searchTitle; sub = t().searchSub; color = 'var(--teal)'; }
    else if (state.topic) {
      const topic = TOPIC_MAP[state.topic];
      title = topic[lang].name; sub = WORLD_MAP[topic.world][lang].name; color = topicColor(state.topic);
    } else if (state.world) {
      const world = WORLD_MAP[state.world];
      title = world[lang].name; sub = world[lang].desc; color = world.color;
    }
    el.resultsBack.innerHTML = svg('back') + '<span>' + t().back + '</span>';
    el.resultsTitle.style.setProperty('--c', color);
    el.resultsTitle.innerHTML =
      '<div><h2>' + title + '</h2><p>' + sub + '</p></div>';
    renderTiersInto(el.resultsBody, ITEMS.filter(matches));
  }

  /* ── sheet ── */
  let lastFocus = null;

  function openSheet(item) {
    lastFocus = document.activeElement;
    openItemId = item.id;
    syncHash();
    const color = itemColor(item);
    const tags = item.topics.map(tid =>
      '<button type="button" class="tag" data-topic="' + tid + '">' +
      dot(color) + TOPIC_MAP[tid][lang].name + '</button>').join('');
    const isSaved = saved.has(item.id);
    const foodLine = item.food === 'with' ? t().withFood : item.food === 'empty' ? t().onEmpty : '';

    clearTimeout(sheetWipe);
    el.sheet.style.setProperty('--c', color);
    el.sheet.innerHTML =
      '<div class="sheet-top">' +
        '<span class="sheet-glyph">' + disc(color) + '</span>' +
        '<h2 id="sheet-title">' + item[lang].name + '</h2>' +
        '<button type="button" class="sheet-close" aria-label="' + t().close + '">' + svg('close') + '</button>' +
      '</div>' +
      '<div class="dose-panel"><span class="meta-label">' + t().dose + '</span>' + statTiles(item) +
        '<div class="dose-note">' + item.d.v + ' ' + item.d.u + ' ' + t()[item.d.per] +
        (foodLine ? ' · ' + foodLine : '') + '</div></div>' +
      safetyBlock(item) +
      '<details class="sheet-sec"><summary class="sec-head">' + t().helpsWith + '</summary><div class="tag-row">' + tags + '</div></details>' +
      '<details class="sheet-sec" open><summary class="sec-head">' + t().whatLabel + '</summary>' +
        helpsRow(item, 'helps helps-lg') +
        whatList(item) + '</details>' +
      '<details class="sheet-sec persp"><summary class="sec-head">' + t().perspectives + '</summary>' +
        '<div class="persp-tabs" role="tablist">' +
          PERSPECTIVES.map((p, i) => '<button type="button" class="persp-tab" role="tab" data-p="' + p.id +
            '" style="--pc:' + p.color + '" aria-selected="' + (i === 0) + '">' + svg(p.icon) +
            '<span>' + t()[p.label] + '</span></button>').join('') +
        '</div><div class="persp-body" id="persp-body"></div></details>' +
      '<div class="note-box">' + svg('info') + '<p><strong>' + t().caution + ':</strong> ' + item[lang].note + '</p></div>' +
      formsBlock(item) + buyBlock(item) +
      '<button type="button" class="sheet-save" aria-pressed="' + isSaved + '">' + svg('bookmark') +
        '<span>' + (isSaved ? t().saved : t().save) + '</span></button>';

    el.scrim.dataset.open = 'true';
    document.body.style.overflow = 'hidden';

    const perspBody = el.sheet.querySelector('#persp-body');
    const showPersp = (pid) => {
      const p = PERSPECTIVES.find(x => x.id === pid);
      const text = (PERSP[item.id] && PERSP[item.id][lang]) ? PERSP[item.id][lang][pid] : '';
      perspBody.style.setProperty('--pc', p.color);
      const cites = (pid === 'biohack' && CITED[item.id]) ? CITED[item.id] : [];
      perspBody.innerHTML = '<span class="lbl">' + t()[p.sub] + '</span>' +
        '<div class="persp-points">' + sentences(text).map(function (x) {
          return '<div class="persp-point"><span class="pp-dot" style="--pc:' + p.color + '"></span><p>' + x + '</p></div>';
        }).join('') + '</div>' +
        (cites.length ? '<div class="cited"><span class="cited-label">' + t().citedLabel + '</span>' +
          cites.map(expertLink).join('') + '</div>' : '');
      el.sheet.querySelectorAll('.persp-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.p === pid)));
    };
    el.sheet.querySelectorAll('.persp-tab').forEach(b => b.addEventListener('click', () => showPersp(b.dataset.p)));
    showPersp('clinical');

    el.sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
    el.sheet.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const tid = tag.dataset.topic;
        closeSheet();
        el.search.value = '';
        el.heroSearch.value = '';
        go({ view: 'results', world: TOPIC_MAP[tid].world, topic: tid, query: '', savedOnly: false });
      });
    });
    const saveBtn = el.sheet.querySelector('.sheet-save');
    saveBtn.addEventListener('click', () => {
      if (saved.has(item.id)) saved.delete(item.id); else saved.add(item.id);
      persist();
      const now = saved.has(item.id);
      saveBtn.setAttribute('aria-pressed', String(now));
      saveBtn.querySelector('span').textContent = now ? t().saved : t().save;
      document.querySelectorAll('[data-id="' + item.id + '"] .bookmark')
        .forEach(m => m.setAttribute('aria-pressed', String(now)));
    });
    el.sheet.querySelector('.sheet-close').focus();
  }

  let sheetWipe = null;
  function closeSheet() {
    openItemId = null;
    syncHash();
    el.scrim.dataset.open = 'false';
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    clearTimeout(sheetWipe);
    sheetWipe = setTimeout(function () {
      if (!openItemId) el.sheet.innerHTML = '';
    }, 350);
  }

  el.scrim.addEventListener('click', (e) => { if (e.target === el.scrim) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && el.scrim.dataset.open === 'true') closeSheet(); });

  /* ── controls ── */
  const goHome = () => {
    trail.length = 0;
    el.search.value = ''; el.heroSearch.value = '';
    go({ view: 'home', world: null, topic: null, phase: null, query: '', savedOnly: false }, true);
  };
  el.homeLink.addEventListener('click', goHome);
  el.guideCta.addEventListener('click', () => go({ view: 'quiz', step: 0, answers: {} }));
  el.planBack.addEventListener('click', () => go({ view: 'quiz', step: QUESTIONS.length - 1 }, true));
  el.worldBack.addEventListener('click', goBack);
  el.cycleBack.addEventListener('click', goBack);
  el.resultsBack.addEventListener('click', goBack);
  el.search.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    state.query = q;
    if (q) { Object.assign(state, { view: 'results', savedOnly: false, topic: null, world: null }); render(); }
    else goHome();
  });
  el.heroSearch.addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    Object.assign(state, { view: 'home', world: null, topic: null, savedOnly: false });
    el.search.value = e.target.value;
    render();
  });
  el.savedBtn.addEventListener('click', () => {
    const on = !state.savedOnly;
    el.search.value = ''; el.heroSearch.value = '';
    go({ view: on ? 'results' : 'home', savedOnly: on, query: '', topic: null, world: null });
  });
  document.querySelectorAll('.segmented button').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      document.querySelectorAll('.segmented button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      if (el.scrim.dataset.open === 'true') closeSheet();
      render();
    });
  });

  render();
  if (!applyHash()) syncHash();
  else if (openItemId) requestAnimationFrame(function () { el.scrim.dataset.open = 'true'; });
})();
</script>
